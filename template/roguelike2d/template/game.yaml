version: 1
name: Roguelike Game
id: dev.nsgo.roguelikegame
appVersion: 0.1.0
window:
  width: 960
  height: 540
display:
  width: 320
  height: 180
  mode: fit
  integerScale: true
  pixelSnap: true
  barColor: '#05070d'
input:
  actions:
    - name: up
      bindings:
        - kind: key
          key: up
        - kind: keyCode
          code: KeyW
        - kind: gamepadButton
          button: dpadUp
        - kind: touchRegion
          region: {x: 26, "y": 102, width: 22, height: 22}
        - kind: mouseRegion
          button: left
          region: {x: 26, "y": 102, width: 22, height: 22}
    - name: down
      bindings:
        - kind: key
          key: down
        - kind: keyCode
          code: KeyS
        - kind: gamepadButton
          button: dpadDown
        - kind: touchRegion
          region: {x: 26, "y": 146, width: 22, height: 22}
        - kind: mouseRegion
          button: left
          region: {x: 26, "y": 146, width: 22, height: 22}
    - name: left
      bindings:
        - kind: key
          key: left
        - kind: keyCode
          code: KeyA
        - kind: gamepadButton
          button: dpadLeft
        - kind: touchRegion
          region: {x: 4, "y": 124, width: 22, height: 22}
        - kind: mouseRegion
          button: left
          region: {x: 4, "y": 124, width: 22, height: 22}
    - name: right
      bindings:
        - kind: key
          key: right
        - kind: keyCode
          code: KeyD
        - kind: gamepadButton
          button: dpadRight
        - kind: touchRegion
          region: {x: 48, "y": 124, width: 22, height: 22}
        - kind: mouseRegion
          button: left
          region: {x: 48, "y": 124, width: 22, height: 22}
    - name: wait
      bindings:
        - kind: key
          key: space
        - kind: keyCode
          code: Period
        - kind: gamepadButton
          button: south
        - kind: touchRegion
          region: {x: 26, "y": 124, width: 22, height: 22}
        - kind: mouseRegion
          button: left
          region: {x: 26, "y": 124, width: 22, height: 22}
    - name: quaff
      bindings:
        - kind: key
          key: q
        - kind: gamepadButton
          button: west
        - kind: touchRegion
          region: {x: 288, "y": 136, width: 30, height: 30}
        - kind: mouseRegion
          button: left
          region: {x: 288, "y": 136, width: 30, height: 30}
    - name: cleave
      bindings:
        - kind: key
          key: e
        - kind: gamepadButton
          button: north
        - kind: touchRegion
          region: {x: 254, "y": 136, width: 30, height: 30}
        - kind: mouseRegion
          button: left
          region: {x: 254, "y": 136, width: 30, height: 30}
    - name: restart
      bindings:
        - kind: key
          key: r
        - kind: key
          key: enter
        - kind: gamepadButton
          button: start
  axes:
    - name: moveX
      negative: left
      positive: right
    - name: moveY
      negative: up
      positive: down
  gamepadAxes:
    - name: moveX
      axis: leftX
      deadZone: 0.25
      axial: true
    - name: moveY
      axis: leftY
      deadZone: 0.25
      axial: true
export:
  output: dist
  presets:
    - platform: macos
      targets: [macos_arm64]
    - platform: windows
      targets: [windows_x64]
    - platform: linux
      targets: [linux_x64, linux_arm64]
    - platform: ios
      targets: [ios]
    - platform: android
      targets: [android_arm64]
    - platform: web
