version: 1
name: Platformer Game
id: dev.nsgo.platformergame
appVersion: 0.1.0
window:
  width: 960
  height: 540
display:
  width: 320
  height: 180
  mode: fit
  integerScale: true
  pixelSnap: true
  barColor: '#10162b'
input:
  actions:
    - name: left
      bindings:
        - kind: key
          key: left
        - kind: keyCode
          code: KeyA
        - kind: gamepadButton
          button: dpadLeft
    - name: right
      bindings:
        - kind: key
          key: right
        - kind: keyCode
          code: KeyD
        - kind: gamepadButton
          button: dpadRight
    - name: jump
      bindings:
        - kind: key
          key: space
        - kind: key
          key: up
        - kind: keyCode
          code: KeyW
        - kind: gamepadButton
          button: south
    - name: restart
      bindings:
        - kind: key
          key: r
        - kind: key
          key: enter
        - kind: gamepadButton
          button: start
  axes:
    - name: move
      negative: left
      positive: right
  gamepadAxes:
    - name: move
      axis: leftX
      deadZone: 0.25
      axial: true
autoload:
  mainScene: level1
  scenes:
    - name: level1
      path: scenes/level1.scene.yaml
export:
  output: dist
  presets:
    - platform: macos
      targets: [macos_arm64]
    - platform: windows
      targets: [windows_x64]
    - platform: linux
      targets: [linux_x64, linux_arm64]
    - platform: ios
      targets: [ios]
    - platform: android
      targets: [android_arm64]
    - platform: web
