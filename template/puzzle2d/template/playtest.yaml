# yaml-language-server: $schema=https://game.nsgo.dev/schemas/playtest.v1.json
version: 1
scope:
  project: spark-slide
  scene: levels
  template: puzzle2d
runs:
  count: 20
  seedStart: 1
  rate: 60
  speed: 1
  maxDuration: 2m0s
bot:
  profile: puzzle-solver
  strategy: Breadth-first search for the shortest solution up to 2 million states, plus a human-like player that undoes after 3 bad moves
  params:
    mode: human
    stateLimit: 2000000
    undoAfterBadMoves: 3
metrics:
  - name: solvable
    label: Solvable
    unit: '%'
    measure:
      kind: ratio
      key: levels_solved
      denomKey: levels_total
      aggregate: min
    goal:
      summary: no dead ends
      source: playtest.yaml
      min: 100
  - name: difficulty_order
    label: Difficulty order
    measure:
      kind: counter
      key: difficulty_dips
      aggregate: max
    goal:
      summary: each level harder than the last
      source: brief.yaml
      equal: 0
  - name: moves_over_par
    label: Moves over par
    measure:
      kind: counter
      key: moves_over_par
      aggregate: median
    goal:
      summary: clever, not tedious
      source: brief.yaml
      max: 5
  - name: shorter_solutions
    label: Unintended solutions
    measure:
      kind: counter
      key: shorter_solutions
      aggregate: max
    goal:
      summary: one intended trick per level
      source: playtest.yaml
      equal: 0
