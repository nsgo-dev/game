# yaml-language-server: $schema=https://game.nsgo.dev/schemas/touchlayout.v1.json
version: 1
reference: {width: 844, height: 390}
maxScale: 1.5
idleAfter: 4s
idleAlpha: 0.45
controls:
  - id: move
    kind: stick
    anchor: bottomLeft
    offset: {x: 16, "y": 16}
    size: {width: 240, height: 220}
    label: Move
    axisX: moveX
    axisY: moveY
    deadZone: 0.15
    floating: true
    radius: 52
  - id: look
    kind: stick
    anchor: bottomRight
    offset: {x: 220, "y": 16}
    size: {width: 240, height: 220}
    label: Look
    axisX: lookX
    axisY: lookY
    deadZone: 0.1
    floating: true
    radius: 52
  - id: fire
    kind: button
    anchor: bottomRight
    offset: {x: 16, "y": 16}
    size: {width: 88, height: 88}
    label: Fire
    action: fire
    text: FIRE
  - id: jump
    kind: button
    anchor: bottomRight
    offset: {x: 116, "y": 16}
    size: {width: 68, height: 68}
    label: Jump
    action: jump
    text: JUMP
  - id: reload
    kind: button
    anchor: bottomRight
    offset: {x: 16, "y": 116}
    size: {width: 64, height: 64}
    label: Reload
    action: reload
    text: RELOAD
  - id: swap
    kind: button
    anchor: bottomRight
    offset: {x: 92, "y": 116}
    size: {width: 64, height: 64}
    label: Swap weapon
    action: next
    text: SWAP
  - id: weapon1
    kind: button
    anchor: bottomRight
    offset: {x: 88, "y": 192}
    size: {width: 60, height: 52}
    label: Weapon 1
    action: weapon1
    text: W1
    shape: rect
  - id: weapon2
    kind: button
    anchor: bottomRight
    offset: {x: 16, "y": 192}
    size: {width: 60, height: 52}
    label: Weapon 2
    action: weapon2
    text: W2
    shape: rect
