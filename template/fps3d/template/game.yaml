version: 1
name: Relay Yard
id: dev.nsgo.relayyard
appVersion: 0.1.0
window:
  width: 960
  height: 540
input:
  actions:
    - name: forward
      bindings:
        - kind: keyCode
          code: KeyW
    - name: back
      bindings:
        - kind: keyCode
          code: KeyS
    - name: left
      bindings:
        - kind: keyCode
          code: KeyA
    - name: right
      bindings:
        - kind: keyCode
          code: KeyD
    - name: lookLeft
      bindings:
        - kind: key
          key: left
    - name: lookRight
      bindings:
        - kind: key
          key: right
    - name: lookUp
      bindings:
        - kind: key
          key: up
    - name: lookDown
      bindings:
        - kind: key
          key: down
    - name: jump
      bindings:
        - kind: key
          key: space
        - kind: gamepadButton
          button: south
    - name: fire
      bindings:
        - kind: mouseButton
          button: left
        - kind: keyCode
          code: KeyF
        - kind: gamepadButton
          button: rightTrigger
    - name: reload
      bindings:
        - kind: keyCode
          code: KeyR
        - kind: gamepadButton
          button: west
    - name: next
      bindings:
        - kind: keyCode
          code: KeyQ
        - kind: gamepadButton
          button: north
    - name: weapon1
      bindings:
        - kind: keyCode
          code: Digit1
    - name: weapon2
      bindings:
        - kind: keyCode
          code: Digit2
    - name: pause
      bindings:
        - kind: key
          key: enter
        - kind: keyCode
          code: KeyP
        - kind: gamepadButton
          button: start
  axes:
    - name: moveX
      negative: left
      positive: right
    - name: moveY
      negative: back
      positive: forward
    - name: lookX
      negative: lookLeft
      positive: lookRight
    - name: lookY
      negative: lookDown
      positive: lookUp
  gamepadAxes:
    - name: moveX
      axis: leftX
    - name: moveY
      axis: leftY
      invert: true
    - name: lookX
      axis: rightX
    - name: lookY
      axis: rightY
      invert: true
export:
  output: dist
  presets:
    - platform: macos
      targets: [macos_arm64]
    - platform: windows
      targets: [windows_x64]
    - platform: ios
      targets: [ios_simulator]
    - platform: android
      targets: [android_arm64]
    - platform: web
