version: 1
name: Fighting Game
id: dev.nsgo.fightinggame
appVersion: 0.1.0
window:
  width: 960
  height: 540
display:
  width: 480
  height: 270
  barColor: '#05060a'
input:
  actions:
    - name: p1_up
      bindings:
        - kind: key
          key: w
        - kind: gamepadButton
          button: dpadUp
    - name: p1_down
      bindings:
        - kind: key
          key: s
        - kind: gamepadButton
          button: dpadDown
    - name: p1_left
      bindings:
        - kind: key
          key: a
        - kind: gamepadButton
          button: dpadLeft
    - name: p1_right
      bindings:
        - kind: key
          key: d
        - kind: gamepadButton
          button: dpadRight
    - name: p1_light
      bindings:
        - kind: key
          key: j
        - kind: gamepadButton
          button: west
        - kind: gamepadButton
          button: south
        - kind: touchRegion
          region: {x: 372, "y": 200, width: 46, height: 46}
        - kind: mouseRegion
          button: left
          region: {x: 372, "y": 200, width: 46, height: 46}
    - name: p1_heavy
      bindings:
        - kind: key
          key: k
        - kind: gamepadButton
          button: north
        - kind: gamepadButton
          button: east
        - kind: touchRegion
          region: {x: 424, "y": 172, width: 46, height: 46}
        - kind: mouseRegion
          button: left
          region: {x: 424, "y": 172, width: 46, height: 46}
    - name: p1_start
      bindings:
        - kind: key
          key: enter
        - kind: gamepadButton
          button: start
    - name: p2_up
      bindings:
        - kind: key
          key: up
        - kind: gamepadButton
          button: dpadUp
    - name: p2_down
      bindings:
        - kind: key
          key: down
        - kind: gamepadButton
          button: dpadDown
    - name: p2_left
      bindings:
        - kind: key
          key: left
        - kind: gamepadButton
          button: dpadLeft
    - name: p2_right
      bindings:
        - kind: key
          key: right
        - kind: gamepadButton
          button: dpadRight
    - name: p2_light
      bindings:
        - kind: keyCode
          code: Period
        - kind: gamepadButton
          button: west
        - kind: gamepadButton
          button: south
    - name: p2_heavy
      bindings:
        - kind: keyCode
          code: Slash
        - kind: gamepadButton
          button: north
        - kind: gamepadButton
          button: east
    - name: p2_start
      bindings:
        - kind: keyCode
          code: ShiftRight
        - kind: gamepadButton
          button: start
    - name: pause
      bindings:
        - kind: key
          key: escape
        - kind: key
          key: p
    - name: hitboxes
      bindings:
        - kind: key
          key: f1
  gamepadAxes:
    - name: p1_move_x
      axis: leftX
      deadZone: 0.3
    - name: p1_move_y
      axis: leftY
      deadZone: 0.3
    - name: p2_move_x
      axis: leftX
      deadZone: 0.3
    - name: p2_move_y
      axis: leftY
      deadZone: 0.3
audio:
  buses:
    - name: sfx
export:
  output: dist
  presets:
    - platform: macos
      targets: [macos_arm64]
    - platform: windows
      targets: [windows_x64]
    - platform: linux
      targets: [linux_x64, linux_arm64]
    - platform: ios
      targets: [ios]
    - platform: android
      targets: [android_arm64]
    - platform: web
