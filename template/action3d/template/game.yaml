version: 1
name: Action Adventure
id: dev.nsgo.actionadventure
appVersion: 0.1.0
window:
  width: 960
  height: 600
  minWidth: 480
  minHeight: 320
input:
  actions:
    - name: left
      bindings:
        - kind: keyCode
          code: KeyA
        - kind: key
          key: left
        - kind: gamepadButton
          button: dpadLeft
    - name: right
      bindings:
        - kind: keyCode
          code: KeyD
        - kind: key
          key: right
        - kind: gamepadButton
          button: dpadRight
    - name: forward
      bindings:
        - kind: keyCode
          code: KeyW
        - kind: key
          key: up
        - kind: gamepadButton
          button: dpadUp
    - name: back
      bindings:
        - kind: keyCode
          code: KeyS
        - kind: key
          key: down
        - kind: gamepadButton
          button: dpadDown
    - name: turnLeft
      bindings:
        - kind: keyCode
          code: KeyQ
        - kind: gamepadButton
          button: leftShoulder
    - name: turnRight
      bindings:
        - kind: keyCode
          code: KeyE
        - kind: gamepadButton
          button: rightShoulder
    - name: jump
      bindings:
        - kind: key
          key: space
        - kind: gamepadButton
          button: south
    - name: attack
      bindings:
        - kind: keyCode
          code: KeyJ
        - kind: key
          key: enter
        - kind: gamepadButton
          button: west
        - kind: gamepadButton
          button: rightTrigger
    - name: restart
      bindings:
        - kind: keyCode
          code: KeyR
        - kind: gamepadButton
          button: start
  axes:
    - name: moveX
      negative: left
      positive: right
    - name: moveY
      negative: forward
      positive: back
    - name: turn
      negative: turnLeft
      positive: turnRight
  gamepadAxes:
    - name: stickX
      axis: leftX
    - name: stickY
      axis: leftY
    - name: lookX
      axis: rightX
autoload:
  mainScene: keep
  scenes:
    - name: keep
      path: scenes/keep.scene.yaml
  resources:
    - name: actors
      path: data/actors.yaml
export:
  output: dist
  presets:
    - platform: macos
      targets: [macos_arm64]
    - platform: windows
      targets: [windows_x64]
    - platform: ios
      targets: [ios_simulator]
    - platform: android
      targets: [android_arm64]
    - platform: web
