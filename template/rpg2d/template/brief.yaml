# yaml-language-server: $schema=https://game.nsgo.dev/schemas/brief.v1.json
version: 1
basis: assumption
pitch: 'A top-down RPG: a town and a meadow, people with branching dialogue, an inventory with equipment, one quest, turn-based battles and three save slots'
genre: [top-down RPG]
platforms: [desktop, web, mobile]
artDirection: Placeholder art that is easy to replace with the game's own.
toneAndAudio: Clear, readable feedback for every action, with room for the game's own sound direction.
feel:
  basis: target
  summary: The playtest bot checks these targets, which playtest.yaml cites as its goals; tune them as the game takes shape.
  targets:
    - metric: reached_goal
      scene: town
      basis: target
      summary: nearly everyone reaches the goal
      min: 18
    - metric: time_to_goal
      scene: town
      basis: target
      summary: a short first outing
      unit: s
      min: 60
      max: 240
    - metric: map_seen
      scene: town
      basis: target
      summary: poking around pays off
      unit: '%'
      min: 80
