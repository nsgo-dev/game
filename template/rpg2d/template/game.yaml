version: 1
name: Hollowbrook
id: dev.nsgo.hollowbrook
appVersion: 0.1.0
window:
  width: 960
  height: 540
  minWidth: 480
  minHeight: 270
display:
  width: 480
  height: 270
  barColor: '#0b0d17'
input:
  actions:
    - name: up
      bindings:
        - kind: key
          key: up
        - kind: keyCode
          code: KeyW
        - kind: gamepadButton
          button: dpadUp
    - name: down
      bindings:
        - kind: key
          key: down
        - kind: keyCode
          code: KeyS
        - kind: gamepadButton
          button: dpadDown
    - name: left
      bindings:
        - kind: key
          key: left
        - kind: keyCode
          code: KeyA
        - kind: gamepadButton
          button: dpadLeft
    - name: right
      bindings:
        - kind: key
          key: right
        - kind: keyCode
          code: KeyD
        - kind: gamepadButton
          button: dpadRight
    - name: confirm
      bindings:
        - kind: key
          key: enter
        - kind: key
          key: space
        - kind: keyCode
          code: KeyE
        - kind: gamepadButton
          button: south
    - name: cancel
      bindings:
        - kind: key
          key: escape
        - kind: key
          key: backspace
        - kind: gamepadButton
          button: east
    - name: menu
      bindings:
        - kind: key
          key: tab
        - kind: gamepadButton
          button: start
  axes:
    - name: moveX
      negative: left
      positive: right
    - name: moveY
      negative: down
      positive: up
  gamepadAxes:
    - name: moveX
      axis: leftX
    - name: moveY
      axis: leftY
      invert: true
export:
  output: dist
  presets:
    - platform: macos
      targets: [macos_arm64]
    - platform: windows
      targets: [windows_x64]
    - platform: linux
      targets: [linux_x64, linux_arm64]
    - platform: ios
      targets: [ios]
    - platform: android
      targets: [android_arm64]
    - platform: web
