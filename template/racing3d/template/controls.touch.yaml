# yaml-language-server: $schema=https://game.nsgo.dev/schemas/touchlayout.v1.json
version: 1
reference: {width: 844, height: 390}
maxScale: 1.5
idleAfter: 4s
idleAlpha: 0.45
controls:
  - id: steer
    kind: stick
    anchor: bottomLeft
    offset: {x: 16, "y": 16}
    size: {width: 260, height: 220}
    label: Steer
    axisX: steer
    deadZone: 0.1
    floating: true
    radius: 56
  - id: gas
    kind: button
    anchor: bottomRight
    offset: {x: 16, "y": 16}
    size: {width: 96, height: 96}
    label: Gas
    action: throttle
    text: GAS
  - id: brake
    kind: button
    anchor: bottomRight
    offset: {x: 128, "y": 16}
    size: {width: 78, height: 78}
    label: Brake
    action: brake
    text: BRAKE
  - id: respawn
    kind: button
    anchor: bottomRight
    offset: {x: 24, "y": 128}
    size: {width: 56, height: 56}
    label: Respawn
    action: respawn
    text: R
