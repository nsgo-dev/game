version: 1
name: Shmup Game
id: dev.nsgo.shmupgame
appVersion: 0.1.0
window:
  width: 405
  height: 720
  minWidth: 270
  minHeight: 480
  appearance: dark
display:
  width: 270
  height: 480
  barColor: '#02040c'
input:
  actions:
    - name: left
      bindings:
        - kind: key
          key: left
        - kind: keyCode
          code: KeyA
        - kind: gamepadButton
          button: dpadLeft
    - name: right
      bindings:
        - kind: key
          key: right
        - kind: keyCode
          code: KeyD
        - kind: gamepadButton
          button: dpadRight
    - name: up
      bindings:
        - kind: key
          key: up
        - kind: keyCode
          code: KeyW
        - kind: gamepadButton
          button: dpadUp
    - name: down
      bindings:
        - kind: key
          key: down
        - kind: keyCode
          code: KeyS
        - kind: gamepadButton
          button: dpadDown
    - name: fire
      bindings:
        - kind: key
          key: z
        - kind: key
          key: space
        - kind: keyCode
          code: KeyJ
        - kind: gamepadButton
          button: south
        - kind: gamepadButton
          button: rightTrigger
    - name: focus
      bindings:
        - kind: key
          key: shift
        - kind: gamepadButton
          button: leftShoulder
        - kind: gamepadButton
          button: leftTrigger
    - name: bomb
      bindings:
        - kind: key
          key: x
        - kind: keyCode
          code: KeyK
        - kind: gamepadButton
          button: east
        - kind: touchRegion
          region: {x: 206, "y": 416, width: 56, height: 56}
    - name: pause
      bindings:
        - kind: key
          key: escape
        - kind: key
          key: p
        - kind: gamepadButton
          button: start
    - name: confirm
      bindings:
        - kind: key
          key: enter
        - kind: gamepadButton
          button: start
  axes:
    - name: moveX
      negative: left
      positive: right
    - name: moveY
      negative: up
      positive: down
  gamepadAxes:
    - name: moveX
      axis: leftX
    - name: moveY
      axis: leftY
audio:
  buses:
    - name: music
      volume: 0.7
    - name: sfx
export:
  output: dist
  presets:
    - platform: macos
      targets: [macos_arm64]
    - platform: windows
      targets: [windows_x64]
    - platform: ios
      targets: [ios_simulator]
    - platform: android
      targets: [android_arm64]
    - platform: web
