# yaml-language-server: $schema=https://game.nsgo.dev/schemas/brief.v1.json
version: 1
pitch: 'A shmup2d game template with a deterministic, readable starting experience.'
basis: assumption
genre: [shmup2d]
platforms: [desktop, web, mobile]
artDirection: Clean placeholder art that is easy to replace.
toneAndAudio: Focused, readable feedback with room for the game's own sound direction.
feel:
  basis: target
  summary: Tune this template's feel targets before shipping.
  targets:
    - metric: cleared
      scene: stage_1
      basis: target
      min: 14
    - metric: hits_per_run
      scene: stage_1
      basis: target
      min: 0
      max: 6
