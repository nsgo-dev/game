version: 1
name: Racing Game
id: dev.nsgo.racinggame
appVersion: 0.1.0
window:
  width: 960
  height: 540
input:
  actions:
    - name: throttle
      bindings:
        - kind: key
          key: up
        - kind: keyCode
          code: KeyW
        - kind: gamepadButton
          button: rightTrigger
        - kind: gamepadButton
          button: south
    - name: brake
      bindings:
        - kind: key
          key: down
        - kind: keyCode
          code: KeyS
        - kind: gamepadButton
          button: leftTrigger
        - kind: gamepadButton
          button: west
    - name: steerLeft
      bindings:
        - kind: key
          key: left
        - kind: keyCode
          code: KeyA
        - kind: gamepadButton
          button: dpadLeft
    - name: steerRight
      bindings:
        - kind: key
          key: right
        - kind: keyCode
          code: KeyD
        - kind: gamepadButton
          button: dpadRight
    - name: handbrake
      bindings:
        - kind: key
          key: space
        - kind: gamepadButton
          button: east
    - name: respawn
      bindings:
        - kind: keyCode
          code: KeyR
        - kind: gamepadButton
          button: north
    - name: confirm
      bindings:
        - kind: key
          key: enter
        - kind: gamepadButton
          button: start
  axes:
    - name: steer
      negative: steerLeft
      positive: steerRight
  gamepadAxes:
    - name: steer
      axis: leftX
      deadZone: 0.1
      axial: true
export:
  output: dist
  presets:
    - platform: macos
      targets: [macos_arm64]
    - platform: windows
      targets: [windows_x64]
    - platform: linux
      targets: [linux_x64, linux_arm64]
    - platform: ios
      targets: [ios]
    - platform: android
      targets: [android_arm64]
    - platform: web
