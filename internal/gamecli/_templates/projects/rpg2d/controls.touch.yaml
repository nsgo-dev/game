# yaml-language-server: $schema=https://game.nsgo.dev/schemas/touchlayout.v1.json
version: 1
reference: {width: 844, height: 390}
maxScale: 1.5
idleAfter: 4s
idleAlpha: 0.45
controls:
  - id: move
    kind: stick
    anchor: bottomLeft
    offset: {x: 12, "y": 12}
    size: {width: 260, height: 220}
    label: Move
    axisX: moveX
    axisY: moveY
    deadZone: 0.15
    floating: true
    radius: 52
  - id: confirm
    kind: button
    anchor: bottomRight
    offset: {x: 20, "y": 28}
    size: {width: 88, height: 88}
    label: Confirm
    action: confirm
    text: A
  - id: cancel
    kind: button
    anchor: bottomRight
    offset: {x: 128, "y": 16}
    size: {width: 76, height: 76}
    label: Cancel
    action: cancel
    text: B
