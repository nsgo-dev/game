# yaml-language-server: $schema=https://game.nsgo.dev/schemas/brief.v1.json
version: 1
basis: assumption
pitch: 'A side-scrolling platformer: a controller with coyote time and jump buffering, three rooms with camera bounds, spikes, pits, sparks to collect, a checkpoint and a goal'
genre: [2D platformer]
platforms: [desktop, web, mobile]
artDirection: Placeholder art that is easy to replace with the game's own.
toneAndAudio: Clear, readable feedback for every action, with room for the game's own sound direction.
feel:
  basis: target
  summary: The playtest bot checks these targets, which playtest.yaml cites as its goals; tune them as the game takes shape.
  targets:
    - metric: finished
      scene: lantern_hills
      basis: target
      summary: most first-timers clear Lantern Hills
      min: 16
    - metric: median_time
      scene: lantern_hills
      basis: target
      summary: brisk run to the beacon
      unit: s
      min: 8
      max: 25
