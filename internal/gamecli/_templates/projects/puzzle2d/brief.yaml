# yaml-language-server: $schema=https://game.nsgo.dev/schemas/brief.v1.json
version: 1
basis: assumption
pitch: 'A 2D grid puzzle: slide a spark to light every lamp, with levels in YAML, undo and redo, a move limit, stars per level and a level select that saves progress'
genre: [2D grid puzzle]
platforms: [desktop, web, mobile]
artDirection: Placeholder art that is easy to replace with the game's own.
toneAndAudio: Clear, readable feedback for every action, with room for the game's own sound direction.
feel:
  basis: target
  summary: The playtest bot checks these targets, which playtest.yaml cites as its goals; tune them as the game takes shape.
  targets:
    - metric: difficulty_order
      scene: levels
      basis: target
      summary: each level harder than the last
      equal: 0
    - metric: moves_over_par
      scene: levels
      basis: target
      summary: clever, not tedious
      max: 5
