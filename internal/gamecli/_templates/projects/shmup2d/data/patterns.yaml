version: 1
patterns:
  - name: shot-1
    kind: aimed
    frame: shot
    count: 2
    speed: 420
    spread: 4
    shots: 0
    interval: 90ms
    radius: 3
  - name: shot-2
    kind: aimed
    frame: shot
    count: 3
    speed: 420
    spread: 10
    shots: 0
    interval: 90ms
    radius: 3
  - name: shot-3
    kind: aimed
    frame: shot
    count: 4
    speed: 420
    spread: 18
    shots: 0
    interval: 90ms
    radius: 3
