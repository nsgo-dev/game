# yaml-language-server: $schema=https://game.nsgo.dev/schemas/playtest.v1.json
version: 1
scope:
  project: shmup-game
  scene: stage_1
  template: shmup2d
runs:
  count: 20
  seedStart: 1
  rate: 60
  speed: 1
  maxDuration: 3m0s
bot:
  profile: shooter
  strategy: Dodges the nearest bullet with 180 ms reaction, fires constantly, takes power-ups within 160 px
  reactionMin: 180ms
  reactionMax: 180ms
  params:
    dangerRange: 36
    lookaheadMs: 400
    powerUpRange: 160
metrics:
  - name: cleared
    label: Cleared the stage
    measure:
      kind: outcome
      key: finished
      aggregate: count
    goal:
      summary: beatable on a second try
      source: brief.yaml
      min: 14
  - name: hits_per_run
    label: Hits per run
    measure:
      kind: event
      key: hit
      aggregate: median
    goal:
      summary: tense but fair
      source: brief.yaml
      min: 0
      max: 6
  - name: powerups_taken
    label: Power-ups taken
    unit: '%'
    measure:
      kind: ratio
      key: powerups_taken
      denomKey: powerups_total
      aggregate: mean
    goal:
      summary: most power-ups reachable
      source: playtest.yaml
      min: 70
  - name: frame_time
    label: Frame time
    unit: ms
    measure:
      kind: perf
      key: frame_ms
      aggregate: median
    goal:
      summary: 16.7 ms at 60 Hz
      source: game.yaml
      max: 16.7
