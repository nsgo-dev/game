version: 1
name: Shardfront
id: dev.nsgo.shardfront
appVersion: 0.1.0
window:
  width: 960
  height: 640
  minWidth: 480
  minHeight: 360
  appearance: dark
display:
  width: 480
  height: 264
  mode: fit
  barColor: '#0b1120'
input:
  actions:
    - name: cursor_left
      bindings:
        - kind: key
          key: left
        - kind: gamepadButton
          button: dpadLeft
    - name: cursor_right
      bindings:
        - kind: key
          key: right
        - kind: gamepadButton
          button: dpadRight
    - name: cursor_up
      bindings:
        - kind: key
          key: up
        - kind: gamepadButton
          button: dpadUp
    - name: cursor_down
      bindings:
        - kind: key
          key: down
        - kind: gamepadButton
          button: dpadDown
    - name: pick
      bindings:
        - kind: key
          key: space
        - kind: gamepadButton
          button: south
    - name: command
      bindings:
        - kind: key
          key: enter
        - kind: gamepadButton
          button: east
    - name: train_worker
      bindings:
        - kind: key
          key: q
        - kind: gamepadButton
          button: west
    - name: train_soldier
      bindings:
        - kind: key
          key: w
        - kind: gamepadButton
          button: north
    - name: train_ranger
      bindings:
        - kind: key
          key: e
        - kind: gamepadButton
          button: rightShoulder
    - name: build_barracks
      bindings:
        - kind: key
          key: b
        - kind: gamepadButton
          button: leftShoulder
    - name: select_army
      bindings:
        - kind: key
          key: a
        - kind: gamepadButton
          button: leftTrigger
    - name: select_workers
      bindings:
        - kind: key
          key: s
        - kind: gamepadButton
          button: rightTrigger
    - name: deselect
      bindings:
        - kind: key
          key: escape
        - kind: gamepadButton
          button: back
    - name: pause
      bindings:
        - kind: key
          key: p
        - kind: gamepadButton
          button: start
    - name: mod_assign
      bindings:
        - kind: key
          key: ctrl
        - kind: key
          key: meta
    - name: mod_add
      bindings:
        - kind: key
          key: shift
    - name: group_0
      bindings:
        - kind: key
          key: "0"
    - name: group_1
      bindings:
        - kind: key
          key: "1"
    - name: group_2
      bindings:
        - kind: key
          key: "2"
    - name: group_3
      bindings:
        - kind: key
          key: "3"
    - name: group_4
      bindings:
        - kind: key
          key: "4"
    - name: group_5
      bindings:
        - kind: key
          key: "5"
    - name: group_6
      bindings:
        - kind: key
          key: "6"
    - name: group_7
      bindings:
        - kind: key
          key: "7"
    - name: group_8
      bindings:
        - kind: key
          key: "8"
    - name: group_9
      bindings:
        - kind: key
          key: "9"
  axes:
    - name: cursor_x
      negative: cursor_left
      positive: cursor_right
    - name: cursor_y
      negative: cursor_up
      positive: cursor_down
  gamepadAxes:
    - name: cursor_x
      axis: leftX
    - name: cursor_y
      axis: leftY
export:
  output: dist
  presets:
    - platform: macos
      targets: [macos_arm64]
    - platform: windows
      targets: [windows_x64]
    - platform: linux
      targets: [linux_x64, linux_arm64]
    - platform: ios
      targets: [ios]
    - platform: android
      targets: [android_arm64]
    - platform: web
