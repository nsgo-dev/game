# yaml-language-server: $schema=https://game.nsgo.dev/schemas/touchlayout.v1.json
version: 1
reference: {width: 844, height: 390}
maxScale: 1.5
idleAfter: 4s
idleAlpha: 0.45
controls:
  - id: p1-move
    kind: stick
    anchor: bottomLeft
    offset: {x: 16, "y": 16}
    size: {width: 160, height: 180}
    label: P1 move
    axisX: p1_move_x
    axisY: p1_move_y
    deadZone: 0.25
    floating: true
    radius: 44
  - id: p1-light
    kind: button
    anchor: bottomLeft
    offset: {x: 192, "y": 16}
    size: {width: 68, height: 68}
    label: P1 light
    action: p1_light
    text: L
  - id: p1-heavy
    kind: button
    anchor: bottomLeft
    offset: {x: 272, "y": 44}
    size: {width: 68, height: 68}
    label: P1 heavy
    action: p1_heavy
    text: H
