version: 1
name: Cave Run
id: dev.nsgo.caverun
appVersion: 0.1.0
window:
  width: 960
  height: 540
display:
  width: 320
  height: 180
  mode: fit
  integerScale: true
  pixelSnap: true
  barColor: '#0b0d17'
input:
  actions:
    - name: left
    - name: right
    - name: jump
  axes:
    - name: move
      negative: left
      positive: right
audio:
  buses:
    - name: music
    - name: sfx
autoload:
  resources:
    - name: level1
      path: assets/level1.tmj
export:
  output: dist
  presets:
    - platform: macos
    - platform: windows
    - platform: linux
    - platform: android
    - platform: web
    - platform: ios
