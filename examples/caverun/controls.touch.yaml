# yaml-language-server: $schema=https://game.nsgo.dev/schemas/touchlayout.v1.json
version: 1
reference: {width: 844, height: 390}
maxScale: 1.5
idleAfter: 4s
idleAlpha: 0.45
controls:
  - id: move
    kind: dpad
    anchor: bottomLeft
    offset: {x: 4, "y": 8}
    size: {width: 104, height: 104}
    label: Move
    ways: 8
    left: left
    right: right
  - id: jump
    kind: button
    anchor: bottomRight
    offset: {x: 20, "y": 16}
    size: {width: 96, height: 96}
    label: Jump
    action: jump
    text: JUMP
