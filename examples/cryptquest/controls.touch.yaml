# yaml-language-server: $schema=https://game.nsgo.dev/schemas/touchlayout.v1.json
version: 1
reference: {width: 844, height: 390}
maxScale: 1.5
idleAfter: 4s
idleAlpha: 0.45
controls:
  - id: move
    kind: stick
    anchor: bottomLeft
    offset: {x: 12, "y": 12}
    size: {width: 320, height: 220}
    label: Move
    axisX: move_x
    axisY: move_y
    deadZone: 0.15
    floating: true
    radius: 56
  - id: interact
    kind: button
    anchor: bottomRight
    offset: {x: 164, "y": 36}
    size: {width: 96, height: 96}
    label: Use
    action: interact
    text: USE
  - id: attack
    kind: button
    anchor: bottomRight
    offset: {x: 20, "y": 20}
    size: {width: 128, height: 128}
    label: Attack
    action: attack
    text: ATTACK
