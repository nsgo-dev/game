version: 1
name: CryptQuest
id: dev.nsgo.game.cryptquest
appVersion: 0.1.0
window:
  width: 960
  height: 660
  minWidth: 640
  minHeight: 460
  appearance: dark
display:
  width: 320
  height: 200
  mode: fit
  pixelSnap: true
  barColor: '#0b0c12'
input:
  actions:
    - name: up
    - name: down
    - name: left
    - name: right
    - name: interact
    - name: attack
  axes:
    - name: move_x
      negative: left
      positive: right
    - name: move_y
      negative: down
      positive: up
export:
  output: dist
  presets:
    - platform: macos
    - platform: windows
    - platform: linux
    - platform: android
    - platform: web
    - platform: ios
