# yaml-language-server: $schema=https://game.nsgo.dev/schemas/touchlayout.v1.json
version: 1
reference: {width: 844, height: 390}
maxScale: 1.5
idleAfter: 4s
idleAlpha: 0.45
controls:
  - id: move
    kind: stick
    anchor: bottomLeft
    offset: {x: 12, "y": 44}
    size: {width: 340, height: 220}
    label: Move
    axisX: move_x
    axisY: move_y
    deadZone: 0.15
    floating: true
    radius: 52
  - id: use
    kind: button
    anchor: bottomRight
    offset: {x: 32, "y": 72}
    size: {width: 100, height: 100}
    label: Enter shrine
    action: interact
    text: USE
