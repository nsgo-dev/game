version: 1
name: Starburst
id: dev.nsgo.game.examples.starburst
appVersion: 0.1.0
window:
  width: 960
  height: 540
  minWidth: 480
  minHeight: 270
  appearance: dark
display:
  width: 480
  height: 270
  mode: fit
  pixelSnap: true
  barColor: '#04070e'
input:
  actions:
    - name: move_left
    - name: move_right
    - name: move_up
    - name: move_down
    - name: fire
      bindings:
        - kind: mouseButton
          button: left
    - name: nova
      bindings:
        - kind: mouseButton
          button: right
  axes:
    - name: move_x
      negative: move_left
      positive: move_right
    - name: move_y
      negative: move_down
      positive: move_up
export:
  output: dist
  presets:
    - platform: macos
    - platform: windows
    - platform: linux
    - platform: android
    - platform: web
    - platform: ios
