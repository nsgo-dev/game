version: 1
parameters: {}
entry: idle
states:
  idle: {clip: Idle, loop: true}
  walk: {clip: Walk, loop: true}
  run: {clip: Run, loop: true}
  jump: {clip: Jump}
  attack: {clip: Attack}
  hit: {clip: Hit}
  death: {clip: Death}
transitions:
  - {from: idle, to: walk, when: "speed > 0"}
  - {from: walk, to: run, when: "speed > 1"}
  - {from: run, to: walk, when: "speed <= 1"}
