version: 1
name: runner
bones:
  - {name: root}
  - {name: torso, parent: root, y: -18, length: 16}
  - {name: head, parent: torso, y: -16, length: 12}
  - {name: arm_l, parent: torso, x: -5, y: -14, length: 12}
  - {name: arm_r, parent: torso, x: 5, y: -14, length: 12}
  - {name: leg_l, parent: torso, x: -3, length: 18}
  - {name: leg_r, parent: torso, x: 3, length: 18}
slots:
  - {name: arm_l, bone: arm_l}
  - {name: leg_l, bone: leg_l}
  - {name: torso, bone: torso}
  - {name: head, bone: head}
  - {name: leg_r, bone: leg_r}
  - {name: arm_r, bone: arm_r}
skins:
  armored:
    head: {frame: helmet, originX: 6, originY: 12}
    torso: {frame: torso_armor, originX: 6, originY: 16}
  default:
    arm_l: {frame: arm_back, originX: 3, originY: 2}
    arm_r: {frame: arm_front, originX: 3, originY: 2}
    head: {frame: head, originX: 6, originY: 12}
    leg_l: {frame: leg_back, originX: 3, originY: 2}
    leg_r: {frame: leg_front, originX: 3, originY: 2}
    torso: {frame: torso, originX: 6, originY: 16}
animations:
  jump:
    duration: 0.5
    bones:
      arm_l:
        rotate:
          - {time: 0, angle: -0.2}
          - {time: 0.1, angle: -1.2}
          - {time: 0.5, angle: -0.2}
      arm_r:
        rotate:
          - {time: 0, angle: 0.2}
          - {time: 0.1, angle: 1.2}
          - {time: 0.5, angle: 0.2}
      torso:
        translate:
          - {time: 0, x: 0, y: 4, curve: stepped}
          - {time: 0.1, x: 0, y: -12, curve: bezier, bezier: [0.2, 0.8, 0.4, 1]}
          - {time: 0.5, x: 0, y: 0}
    slots:
      arm_l:
        alpha:
          - {time: 0, value: 1}
          - {time: 0.25, value: 0.5}
          - {time: 0.5, value: 1}
  run:
    duration: 0.4
    loop: true
    bones:
      arm_l:
        rotate:
          - {time: 0, angle: 0.8}
          - {time: 0.2, angle: -0.8}
          - {time: 0.4, angle: 0.8}
      arm_r:
        rotate:
          - {time: 0, angle: -0.8}
          - {time: 0.2, angle: 0.8}
          - {time: 0.4, angle: -0.8}
      head:
        rotate:
          - {time: 0, angle: -0.2}
          - {time: 0.4, angle: -0.2}
      leg_l:
        rotate:
          - {time: 0, angle: -0.8}
          - {time: 0.2, angle: 0.8}
          - {time: 0.4, angle: -0.8}
      leg_r:
        rotate:
          - {time: 0, angle: 0.8}
          - {time: 0.2, angle: -0.8}
          - {time: 0.4, angle: 0.8}
      torso:
        translate:
          - {time: 0, x: 0, y: 2}
          - {time: 0.2, x: 0, y: -2}
          - {time: 0.4, x: 0, y: 2}
        rotate:
          - {time: 0, angle: 0.25}
          - {time: 0.4, angle: 0.25}
        scale:
          - {time: 0, x: 1.05, y: 0.95}
          - {time: 0.2, x: 0.95, y: 1.05}
          - {time: 0.4, x: 1.05, y: 0.95}
  walk:
    duration: 0.8
    loop: true
    bones:
      arm_l:
        rotate:
          - {time: 0, angle: 0.4}
          - {time: 0.4, angle: -0.4}
          - {time: 0.8, angle: 0.4}
      arm_r:
        rotate:
          - {time: 0, angle: -0.4}
          - {time: 0.4, angle: 0.4}
          - {time: 0.8, angle: -0.4}
      head:
        rotate:
          - {time: 0, angle: -0.05}
          - {time: 0.4, angle: 0.05}
          - {time: 0.8, angle: -0.05}
      leg_l:
        rotate:
          - {time: 0, angle: -0.4}
          - {time: 0.4, angle: 0.4}
          - {time: 0.8, angle: -0.4}
      leg_r:
        rotate:
          - {time: 0, angle: 0.4}
          - {time: 0.4, angle: -0.4}
          - {time: 0.8, angle: 0.4}
      torso:
        translate:
          - {time: 0, x: 0, y: 0, curve: bezier, bezier: [0.25, 0.1, 0.25, 1]}
          - {time: 0.2, x: 0, y: -2}
          - {time: 0.4, x: 0, y: 0}
          - {time: 0.6, x: 0, y: -2}
          - {time: 0.8, x: 0, y: 0}
        rotate:
          - {time: 0, angle: 0.05}
          - {time: 0.8, angle: 0.05}
    slots:
      head:
        attachment:
          - {time: 0, frame: head}
          - {time: 0.6, frame: head_blink}
          - {time: 0.7, frame: head}
