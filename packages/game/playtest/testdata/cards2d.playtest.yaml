# yaml-language-server: $schema=https://game.nsgo.dev/schemas/playtest.v1.json
version: 1
scope:
  project: suit-ladders
  scene: deck_matchups
  template: cards2d
runs:
  count: 5
  seedStart: 1
  rate: 60
  speed: 1
  maxDuration: 5m0s
bot:
  profile: card-ai
  strategy: Two greedy AIs that look one turn ahead play each deck pair, taking turns to go first
  params:
    flagWinRateAbove: 60
    matchesPerPair: 40
    maxActionsPerTurn: 4
    maxTurns: 60
metrics:
  - name: first_player_wins
    label: First player wins
    unit: '%'
    measure:
      kind: ratio
      key: first_player_wins
      denomKey: matches_played
      aggregate: mean
    goal:
      summary: going first is a small edge
      source: brief.yaml
      min: 45
      max: 55
  - name: match_length
    label: Match length
    unit: turns
    measure:
      kind: counter
      key: match_turns
      aggregate: median
    goal:
      summary: quick matches
      source: brief.yaml
      min: 8
      max: 12
  - name: most_lopsided_pair
    label: Most lopsided pair
    unit: '%'
    measure:
      kind: counter
      key: max_pair_win_rate
      aggregate: max
    goal:
      summary: no pair above 60%
      source: playtest.yaml
      max: 60
  - name: ai_think_time
    label: AI think time
    unit: ms
    measure:
      kind: counter
      key: ai_think_ms
      aggregate: median
    goal:
      summary: answers in under 50 ms
      source: playtest.yaml
      max: 50
