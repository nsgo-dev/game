# yaml-language-server: $schema=https://game.nsgo.dev/schemas/playtest.v1.json
version: 1
scope:
  project: hollowbrook
  scene: town
  template: rpg2d
runs:
  count: 20
  seedStart: 1
  rate: 60
  speed: 8
  maxDuration: 6m0s
bot:
  profile: topdown-explorer
  strategy: Walks to the nearest unseen tile, talks to every NPC once, opens every chest, gives up after 6 minutes
  params:
    openChests: true
    talkToNPCs: true
    visionRadius: 3
metrics:
  - name: reached_goal
    label: Reached the goal
    measure:
      kind: outcome
      key: finished
      aggregate: count
    goal:
      summary: nearly everyone reaches the goal
      source: brief.yaml
      min: 18
  - name: time_to_goal
    label: Time to goal
    unit: s
    measure:
      kind: timer
      key: goal_time
      aggregate: median
    goal:
      summary: a short first outing
      source: brief.yaml
      min: 60
      max: 240
  - name: map_seen
    label: Map seen
    unit: '%'
    measure:
      kind: ratio
      key: tiles_seen
      denomKey: tiles_total
      aggregate: mean
    goal:
      summary: poking around pays off
      source: brief.yaml
      min: 80
  - name: frame_time
    label: Frame time
    unit: ms
    measure:
      kind: perf
      key: frame_ms
      aggregate: median
    goal:
      summary: 16.7 ms at 60 Hz
      source: game.yaml
      max: 16.7
  - name: time_per_tile
    label: Time per tile
    measure:
      kind: event
      key: tile_visit
      aggregate: sum
      heatMap: true
