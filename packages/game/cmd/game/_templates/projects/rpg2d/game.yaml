version: 1
name: Hollowbrook
id: dev.nsgo.hollowbrook
appVersion: 0.1.0
window:
  width: 960
  height: 540
  minWidth: 480
  minHeight: 270
display:
  width: 480
  height: 270
  barColor: '#0b0d17'
input:
  actions:
    - name: up
      bindings:
        - kind: key
          key: up
        - kind: keyCode
          code: KeyW
        - kind: gamepadButton
          button: dpadUp
        - kind: touchRegion
          region: {x: 44, "y": 170, width: 36, height: 32}
        - kind: mouseRegion
          button: left
          region: {x: 44, "y": 170, width: 36, height: 32}
    - name: down
      bindings:
        - kind: key
          key: down
        - kind: keyCode
          code: KeyS
        - kind: gamepadButton
          button: dpadDown
        - kind: touchRegion
          region: {x: 44, "y": 234, width: 36, height: 32}
        - kind: mouseRegion
          button: left
          region: {x: 44, "y": 234, width: 36, height: 32}
    - name: left
      bindings:
        - kind: key
          key: left
        - kind: keyCode
          code: KeyA
        - kind: gamepadButton
          button: dpadLeft
        - kind: touchRegion
          region: {x: 8, "y": 202, width: 36, height: 32}
        - kind: mouseRegion
          button: left
          region: {x: 8, "y": 202, width: 36, height: 32}
    - name: right
      bindings:
        - kind: key
          key: right
        - kind: keyCode
          code: KeyD
        - kind: gamepadButton
          button: dpadRight
        - kind: touchRegion
          region: {x: 80, "y": 202, width: 36, height: 32}
        - kind: mouseRegion
          button: left
          region: {x: 80, "y": 202, width: 36, height: 32}
    - name: confirm
      bindings:
        - kind: key
          key: enter
        - kind: key
          key: space
        - kind: keyCode
          code: KeyE
        - kind: gamepadButton
          button: south
        - kind: touchRegion
          region: {x: 420, "y": 198, width: 52, height: 52}
        - kind: mouseRegion
          button: left
          region: {x: 420, "y": 198, width: 52, height: 52}
    - name: cancel
      bindings:
        - kind: key
          key: escape
        - kind: key
          key: backspace
        - kind: gamepadButton
          button: east
        - kind: touchRegion
          region: {x: 364, "y": 222, width: 44, height: 40}
        - kind: mouseRegion
          button: left
          region: {x: 364, "y": 222, width: 44, height: 40}
    - name: menu
      bindings:
        - kind: key
          key: tab
        - kind: gamepadButton
          button: start
  axes:
    - name: moveX
      negative: left
      positive: right
    - name: moveY
      negative: up
      positive: down
  gamepadAxes:
    - name: moveX
      axis: leftX
    - name: moveY
      axis: leftY
export:
  output: dist
  presets:
    - platform: macos
      targets: [macos_arm64]
    - platform: windows
      targets: [windows_x64]
    - platform: ios
      targets: [ios_simulator]
    - platform: android
      targets: [android_arm64]
    - platform: web
