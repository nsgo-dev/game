  ending.dawn: 黎明港口
  ending.dawn.text: 地图送到了港口，摆渡人也一起到了。
  ending.lost: 迷失雾中
  ending.lost.text: 那盏假灯引着他们兜圈子，一直到天亮。
  endings.found: 已发现结局：{found}/{total}
  hud.auto: 自动
  hud.log: 记录
  hud.menu: 菜单
  hud.skip: 快进
  line.dawn_01: 沼泽水道笔直而安静，和地图上画的分毫不差。
  line.dawn_02: 是港口的钟声。我们赶在潮水转向之前到了。
  line.dawn_03: 我们到了。你哥哥的那趟渡河也到了。
  line.dock_01: 午夜时分，最后一班渡船驶离东码头。
  line.dock_02: 你来晚了。雾已经漫上水面了。
  line.dock_03: 我有一张地图，必须在天亮前送到港口。
  line.dock_04: 地图可不会划船。上面画着什么？
  line.dock_05: 一条穿过沼泽的新水道。是我亲手测绘的。
  line.dock_06: 那你举好灯笼，我来划船。
  line.dock_07: 港务长付钱要的东西。你知道这些就够了。
  line.dock_08: 随你。雾可不在乎什么秘密。
  line.dock_c1: 把地图给他看
  line.dock_c2: 把地图卷着不给看
  line.fork_01: 河道在此分岔，左岸有一盏灯在闪，右边是开阔的沼泽。
  line.fork_02: 大家都跟着那盏灯走。人们说那是安全的路。
  line.fork_03: 不过地图是你的。你说沼泽水道是真的，我就信你。
  line.fork_04: 我可不会凭一个陌生人的话把船开进沼泽。
  line.fork_05: 不行。我们跟着灯走。
  line.fork_c1: 跟着那盏灯走
  line.fork_c2: 走沼泽水道
  line.lost_01: 那盏灯在前方飘远，随即消失，浓雾合拢过来。
  line.lost_02: 那根本不是灯塔。我哥哥当年跟的就是它。
  line.lost_03: 那这张地图只能干干地留在我包里，港口什么也等不到了。
  line.river_01: 码头的灯火渐渐远去，最后只剩下那盏灯笼。
  line.river_02: 听见了吗？有什么东西在撞船身。
  line.river_03: 是一只漂流的木箱，上面漆着一个名字。是你家的。
  line.river_04: 是我哥哥的。他去年春天走过这条水路，再也没有回来。
  line.river_05: 那我们替他把这趟渡河走完。
  line.river_06: 划得快，船就会撞上礁石。
  line.river_07: 那就慢一点，但别停下。
  line.river_c1: 提着灯笼探身去看
  line.river_c2: 让他划快一点
