version: 1
name: Spark Slide
id: dev.nsgo.sparkslide
appVersion: 0.1.0
window:
  width: 480
  height: 720
input:
  actions:
    - name: left
      bindings:
        - kind: key
          key: left
        - kind: keyCode
          code: KeyA
        - kind: gamepadButton
          button: dpadLeft
    - name: right
      bindings:
        - kind: key
          key: right
        - kind: keyCode
          code: KeyD
        - kind: gamepadButton
          button: dpadRight
    - name: up
      bindings:
        - kind: key
          key: up
        - kind: keyCode
          code: KeyW
        - kind: gamepadButton
          button: dpadUp
    - name: down
      bindings:
        - kind: key
          key: down
        - kind: keyCode
          code: KeyS
        - kind: gamepadButton
          button: dpadDown
    - name: undo
      bindings:
        - kind: key
          key: z
        - kind: key
          key: backspace
        - kind: gamepadButton
          button: west
        - kind: gamepadButton
          button: leftShoulder
    - name: redo
      bindings:
        - kind: key
          key: "y"
        - kind: gamepadButton
          button: rightShoulder
    - name: restart
      bindings:
        - kind: key
          key: r
        - kind: gamepadButton
          button: north
    - name: confirm
      bindings:
        - kind: key
          key: enter
        - kind: key
          key: space
        - kind: gamepadButton
          button: south
    - name: back
      bindings:
        - kind: key
          key: escape
        - kind: gamepadButton
          button: east
  gamepadAxes:
    - name: moveX
      axis: leftX
      deadZone: 0.5
      axial: true
    - name: moveY
      axis: leftY
      deadZone: 0.5
      axial: true
export:
  output: dist
  presets:
    - platform: macos
      targets: [macos_arm64]
    - platform: windows
      targets: [windows_x64]
    - platform: ios
      targets: [ios_simulator]
    - platform: android
      targets: [android_arm64]
    - platform: web
