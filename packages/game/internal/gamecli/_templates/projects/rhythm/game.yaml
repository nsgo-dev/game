version: 1
name: Pulse Lanes
id: dev.nsgo.pulselanes
appVersion: 0.1.0
window:
  width: 480
  height: 720
input:
  actions:
    - name: lane1
      bindings:
        - kind: key
          key: d
        - kind: key
          key: left
        - kind: gamepadButton
          button: dpadLeft
        - kind: gamepadButton
          button: leftShoulder
    - name: lane2
      bindings:
        - kind: key
          key: f
        - kind: key
          key: down
        - kind: gamepadButton
          button: dpadDown
        - kind: gamepadButton
          button: leftTrigger
    - name: lane3
      bindings:
        - kind: key
          key: j
        - kind: key
          key: up
        - kind: gamepadButton
          button: south
        - kind: gamepadButton
          button: rightTrigger
    - name: lane4
      bindings:
        - kind: key
          key: k
        - kind: key
          key: right
        - kind: gamepadButton
          button: east
        - kind: gamepadButton
          button: rightShoulder
    - name: up
      bindings:
        - kind: key
          key: up
        - kind: key
          key: w
        - kind: gamepadButton
          button: dpadUp
    - name: down
      bindings:
        - kind: key
          key: down
        - kind: key
          key: s
        - kind: gamepadButton
          button: dpadDown
    - name: confirm
      bindings:
        - kind: key
          key: enter
        - kind: key
          key: space
        - kind: gamepadButton
          button: south
    - name: back
      bindings:
        - kind: key
          key: escape
        - kind: key
          key: backspace
        - kind: gamepadButton
          button: east
        - kind: gamepadButton
          button: back
    - name: pause
      bindings:
        - kind: key
          key: escape
        - kind: key
          key: p
        - kind: gamepadButton
          button: start
export:
  output: dist
  presets:
    - platform: macos
      targets: [macos_arm64]
    - platform: windows
      targets: [windows_x64]
    - platform: ios
      targets: [ios_simulator]
    - platform: android
      targets: [android_arm64]
    - platform: web
