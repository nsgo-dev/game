version: 1
name: Hearthkeeper
id: dev.nsgo.hearthkeeper
appVersion: 0.1.0
window:
  width: 420
  height: 720
display:
  width: 360
  height: 600
  mode: fit
  barColor: '#1c1412'
input:
  actions:
    - name: stoke
      bindings:
        - kind: key
          key: space
        - kind: gamepadButton
          button: west
    - name: up
      bindings:
        - kind: key
          key: up
        - kind: keyCode
          code: KeyW
        - kind: gamepadButton
          button: dpadUp
    - name: down
      bindings:
        - kind: key
          key: down
        - kind: keyCode
          code: KeyS
        - kind: gamepadButton
          button: dpadDown
    - name: left
      bindings:
        - kind: key
          key: left
        - kind: keyCode
          code: KeyA
        - kind: gamepadButton
          button: dpadLeft
    - name: right
      bindings:
        - kind: key
          key: right
        - kind: keyCode
          code: KeyD
        - kind: gamepadButton
          button: dpadRight
    - name: confirm
      bindings:
        - kind: key
          key: enter
        - kind: gamepadButton
          button: south
    - name: back
      bindings:
        - kind: key
          key: escape
        - kind: gamepadButton
          button: east
    - name: notation
      bindings:
        - kind: key
          key: "n"
        - kind: gamepadButton
          button: north
export:
  output: dist
  presets:
    - platform: macos
      targets: [macos_arm64]
    - platform: windows
      targets: [windows_x64]
    - platform: ios
      targets: [ios_simulator]
    - platform: android
      targets: [android_arm64]
    - platform: web
