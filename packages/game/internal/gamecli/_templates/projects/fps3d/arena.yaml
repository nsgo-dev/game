version: 1
name: Relay Yard
cellSize: 2
wallHeight: 3
crateHeight: 1.1
layout:
  - '#################'
  - '#S......#......S#'
  - '#.##.........##.#'
  - '#.#..1..c..2..#.#'
  - '#.....#####.....#'
  - '#..c....H....c..#'
  - '#...#...P...#...#'
  - '#..c....A....c..#'
  - '#.....#####.....#'
  - '#.#..4..c..3..#.#'
  - '#.##.........##.#'
  - '#S......#......S#'
  - '#################'
player:
  health: 100
  radius: 0.4
  height: 1.8
  eyeHeight: 1.6
  speed: 6
  jumpSpeed: 5.5
  turnSpeed: 2.6
  mouseSensitivity: 0.0035
weapons:
  - name: Pulse rifle
    kind: hitscan
    damage: 20
    fireInterval: 0.16
    magazine: 20
    reserve: 100
    maxReserve: 160
    reloadTime: 1.3
    range: 60
  - name: Arc launcher
    kind: projectile
    damage: 90
    fireInterval: 0.9
    magazine: 3
    reserve: 6
    maxReserve: 9
    reloadTime: 1.8
    range: 40
    speed: 22
    splashRadius: 3
enemies:
  - name: drone
    health: 60
    radius: 0.4
    height: 1.4
    speed: 3.2
    sightRange: 28
    fieldOfView: 3.6
    attackRange: 16
    fireInterval: 1.4
    boltSpeed: 13
    boltDamage: 7
    color: [0.85, 0.32, 0.22]
  - name: warden
    health: 160
    radius: 0.55
    height: 2
    speed: 2.2
    sightRange: 30
    fieldOfView: 3
    attackRange: 18
    fireInterval: 1
    boltSpeed: 11
    boltDamage: 12
    color: [0.55, 0.3, 0.85]
pickups:
  - symbol: H
    effect: health
    amount: 35
    respawn: 20
  - symbol: A
    effect: ammo
    amount: 2
    respawn: 20
waves:
  - groups:
      - enemy: drone
        count: 2
  - groups:
      - enemy: drone
        count: 3
      - enemy: warden
        count: 1
  - groups:
      - enemy: drone
        count: 4
      - enemy: warden
        count: 2
countdown: 3
intermission: 4
