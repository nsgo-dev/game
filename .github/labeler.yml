# Path labels for pull requests, applied by pr-triage.yml. Each package under pkg/ gets a pkg/<name> label, the root package and the module files get pkg/game, and the rest of the repository is labelled by area. A new package needs its own entry here.

pkg/game:
  - changed-files:
      - any-glob-to-any-file:
          - "*.go"
          - go.mod
          - go.sum

