name: Website

# Builds the site in apps/website, every page prerendered to static HTML, with the playground's web builds of the examples and the API reference generated from packages/game's Go doc comments, and deploys it to GitHub Pages. It builds again as this repository's issues change, so the roadmap follows them, and hourly for the NSGo issues under nsgo-dev/nsgo#1047, whose changes cannot trigger a workflow here.
on:
  push:
    branches:
      - main
    paths:
      - "apps/website/**"
      - "docs/**"
      - "examples/**"
      - "packages/game/**"
      - "go.work"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "apps/website/**"
      - "docs/**"
      - "examples/**"
      - "packages/game/**"
      - "go.work"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/website.yml"
  issues:
    types: [opened, edited, closed, reopened, deleted, transferred]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # The playground's examples and the API reference's pages and api.json, which packages/game/cmd/gameapi generates, need Go.
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: packages/game/go.mod
          cache: true
          cache-dependency-path: |
            packages/game/go.sum
            examples/*/go.sum
      # The playground runs each example's web build, which the site's build requires in CI (docs/en/playground.md).
      - name: Build the playground's examples
        run: bun run playground
      - name: Test
        run: bun run test
      # The site's base path and origin: "/" on its custom domain, "/game/" on nsgo-dev.github.io until one is set. A pull request, which deploys nothing, builds for "/" on the domain in public/CNAME.
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build, typecheck and prerender
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run build
      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/website/dist

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
