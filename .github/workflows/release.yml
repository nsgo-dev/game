name: Release

# Runs the full test and cross-target check suite on release tags, builds signed desktop
# installers for NSGo Game Editor (macOS signed & notarized with the org's Developer ID,
# Linux .deb / .pkg.tar.gz / .AppImage + install scripts, Windows -setup.exe installers,
# plus signed update appcasts via NSGO_UPDATES_KEY) and cross-platform nsgo-game CLI
# archives, then publishes them on the GitHub Release with notes extracted from CHANGELOG.md.
#
# Pull requests touching cmd/editor or this workflow build and sign (when org secrets are
# available) without publishing. workflow_dispatch with an existing tag (for example v0.1.0)
# builds and uploads the editor and CLI assets onto that release without moving the tag.
on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "cmd/editor/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional existing release tag (e.g. v0.1.0) to build and upload editor/CLI assets onto; leave empty to dry-run."
        required: false
        type: string

concurrency:
  group: release-${{ github.event_name }}-${{ inputs.tag || github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  meta:
    name: Resolve version and release notes
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve release mode and version
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            mode="release"
            tag="$REF_NAME"
            version="${tag#v}"
          elif [ "$EVENT" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            mode="upload"
            tag="$INPUT_TAG"
            if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Invalid tag '$tag' (expected vX.Y.Z or vX.Y.Z-suffix)."
              exit 1
            fi
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null
            version="${tag#v}"
          else
            mode="check"
            version=$(sed -nE 's/^version: *"?([0-9.]+)"? *$/\1/p' cmd/editor/nsgo.yaml)
            tag="v$version"
          fi
          {
            echo "mode=$mode"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: Extract release notes from CHANGELOG.md
        env:
          MODE: ${{ steps.resolve.outputs.mode }}
          TAG: ${{ steps.resolve.outputs.tag }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail

          if [ "$MODE" = "check" ]; then
            printf 'Dry-run build check for NSGo Game Editor %s.\n' "$VERSION" > release-notes.md
            exit 0
          fi

          if [ ! -f CHANGELOG.md ]; then
            echo "Error: CHANGELOG.md not found." >&2
            exit 1
          fi

          version="$TAG"
          version_no_v="${version#v}"

          status=0
          awk -v ver="$version" -v ver_no_v="$version_no_v" '
            /^## / {
              if (in_section) {
                in_section = 0
                next
              }
              heading = substr($0, 4)
              sub(/^[[:space:]]+/, "", heading)
              token = heading
              sub(/[[:space:]].*$/, "", token)
              if (substr(token, 1, 1) == "[" && substr(token, length(token), 1) == "]") {
                token = substr(token, 2, length(token) - 2)
              }
              if (!found && (token == ver || token == ver_no_v)) {
                in_section = 1
                found = 1
              }
              next
            }
            in_section && /^\[[^]]+\]:[[:space:]]+/ {
              in_section = 0
              next
            }
            in_section {
              lines[++n] = $0
            }
            END {
              if (!found) exit 2
              start = 1
              while (start <= n && lines[start] ~ /^[[:space:]]*$/) start++
              end = n
              while (end >= start && lines[end] ~ /^[[:space:]]*$/) end--
              if (start > end) exit 3
              for (i = start; i <= end; i++) print lines[i]
            }
          ' CHANGELOG.md > release-notes.md || status=$?

          if [ "$status" -eq 2 ]; then
            echo "Error: no section for '$version' found in CHANGELOG.md (expected a heading such as '## $version - YYYY-MM-DD' or '## [$version_no_v] - YYYY-MM-DD')." >&2
            exit 1
          elif [ "$status" -eq 3 ]; then
            echo "Error: section for '$version' in CHANGELOG.md is empty." >&2
            exit 1
          elif [ "$status" -ne 0 ]; then
            echo "Error: failed to extract release notes for '$version' from CHANGELOG.md." >&2
            exit 1
          fi

          # GitHub Releases caps the body at 125,000 characters; truncate cleanly at a line
          # boundary under 120,000 characters and link to the full CHANGELOG.md on the tag.
          max_chars=120000
          if [ "$(wc -m < release-notes.md)" -gt "$max_chars" ]; then
            footer="$(printf '\n\n---\n\n_Release notes truncated to fit GitHub'\''s 125,000-character limit. See the full section in [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md)._\n' "$GITHUB_REPOSITORY" "$TAG")"
            keep=$((max_chars - ${#footer}))
            awk -v keep="$keep" '
              {
                add = length($0) + 1
                if (total + add > keep) exit
                print
                total += add
              }
            ' release-notes.md > release-notes.truncated.md
            printf '%s' "$footer" >> release-notes.truncated.md
            mv release-notes.truncated.md release-notes.md
          fi
      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7
          if-no-files-found: error

  test:
    name: Test (${{ matrix.os }})
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os:
          - depot-ubuntu-24.04-4
          - depot-macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Test
        run: go tool nsgo test ./...

  check:
    name: Build and vet
    if: github.event_name == 'push'
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Check Go formatting
        run: |
          unformatted=$(git ls-files -z -- '*.go' | xargs -0 -r gofmt -l)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Build and vet every target but iOS
        run: go tool nsgo check -target macos,windows,linux,android,web

  apple:
    name: Build and vet (iOS)
    if: github.event_name == 'push'
    runs-on: depot-macos-15
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Build and vet iOS
        run: go tool nsgo check -target ios,ios_simulator

  editor:
    name: Build Editor (${{ matrix.name }})
    needs: meta
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.name == 'macOS' && 60 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: depot-macos-15
            targets: macos_arm64,macos_x64
            installers: ".dmg"
          - name: Linux
            os: depot-ubuntu-24.04-4
            targets: linux_x64,linux_arm64
            installers: ".deb .pkg.tar.gz .AppImage"
            scripts: true
          - name: Windows
            os: depot-ubuntu-24.04-4
            targets: windows_x64,windows_arm64
            installers: "-setup.exe"
    env:
      MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Verify updates signing key for releases
        if: needs.meta.outputs.mode != 'check'
        env:
          HAS_UPDATES_KEY: ${{ secrets.NSGO_UPDATES_KEY != '' }}
        run: |
          if [ "$HAS_UPDATES_KEY" != "true" ]; then
            echo "::error::NSGO_UPDATES_KEY is not set, so the installers cannot be signed for updates."
            exit 1
          fi
      - name: Import macOS signing certificate and notary key
        id: signing
        if: matrix.name == 'macOS'
        env:
          REQUIRE_SIGNING: ${{ needs.meta.outputs.mode != 'check' }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in MACOS_SIGNING_IDENTITY MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD APPSTORE_API_KEY_P8 APPSTORE_API_KEY_ID APPSTORE_API_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              if [ "$REQUIRE_SIGNING" = "true" ]; then
                echo "::error::$name is not set, so the macOS packages cannot be signed and notarized."
                exit 1
              fi
              echo "::warning::$name is not set; the macOS packages will be signed ad hoc."
              exit 0
            fi
          done
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          # shellcheck disable=SC2046 # one argument per keychain path
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | xargs)
          if ! security find-identity -v -p codesigning "$keychain" | grep -qF "\"$MACOS_SIGNING_IDENTITY\""; then
            echo "::error::MACOS_CERTIFICATE does not hold $MACOS_SIGNING_IDENTITY."
            exit 1
          fi
          key="$RUNNER_TEMP/notary-key.p8"
          printf '%s' "$APPSTORE_API_KEY_P8" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          echo "notary-key=$key" >> "$GITHUB_OUTPUT"
      - name: Build NSGo Game Editor
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          TARGETS: ${{ matrix.targets }}
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          NOTARY_KEY: ${{ steps.signing.outputs.notary-key }}
          NOTARY_KEY_ID: ${{ steps.signing.outputs.notary-key != '' && secrets.APPSTORE_API_KEY_ID || '' }}
          NOTARY_ISSUER: ${{ steps.signing.outputs.notary-key != '' && secrets.APPSTORE_API_ISSUER_ID || '' }}
          NSGO_UPDATES_KEY: ${{ secrets.NSGO_UPDATES_KEY }}
        run: |
          set -euo pipefail
          sign=()
          if [ -n "$KEYCHAIN" ]; then
            sign=(-sign "$MACOS_SIGNING_IDENTITY")
            export NSGO_NOTARY_KEY="$NOTARY_KEY"
            export NSGO_NOTARY_KEY_ID="$NOTARY_KEY_ID"
            export NSGO_NOTARY_ISSUER="$NOTARY_ISSUER"
          fi
          go tool nsgo build \
            -open=false \
            -version "$VERSION" \
            -target "$TARGETS" \
            -output "$RUNNER_TEMP/packages" \
            -release-notes "$RUNNER_TEMP/release-notes.md" \
            "${sign[@]}" \
            ./cmd/editor
      - name: Verify macOS signatures and notarization
        if: steps.signing.outputs.keychain != ''
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for target in ${TARGETS//,/ }; do
            apps=("$RUNNER_TEMP"/packages/*-"$target"/*.app)
            if [ "${#apps[@]}" -ne 1 ]; then
              echo "::error::nsgo build made ${#apps[@]} apps for $target, not one"
              exit 1
            fi
            codesign --verify --deep --strict --verbose=2 "${apps[0]}"
            codesign -dvv "${apps[0]}" 2>&1 | grep -F "Authority=$MACOS_SIGNING_IDENTITY"
            dmgs=("$RUNNER_TEMP"/packages/releases/*-"${target/_/-}".dmg)
            if [ "${#dmgs[@]}" -ne 1 ]; then
              echo "::error::nsgo build made ${#dmgs[@]} disk images for $target, not one"
              exit 1
            fi
            xcrun stapler validate "${dmgs[0]}"
            spctl --assess --type open --context context:primary-signature --verbose=2 "${dmgs[0]}"
          done
      - name: Collect editor packages
        env:
          TARGETS: ${{ matrix.targets }}
          INSTALLERS: ${{ matrix.installers }}
          SCRIPTS: ${{ matrix.scripts && 'true' || '' }}
          REQUIRE_APPCAST: ${{ needs.meta.outputs.mode != 'check' }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/packages/releases"
          shopt -s nullglob
          read -ra suffixes <<<"$INSTALLERS"
          for target in ${TARGETS//,/ }; do
            for suffix in "${suffixes[@]}"; do
              found=(*-"${target/_/-}${suffix}")
              if [ "${#found[@]}" -ne 1 ] || [ ! -f "${found[0]}.sha256" ]; then
                echo "::error::nsgo build made ${#found[@]} files matching *-${target/_/-}${suffix}, not one with its .sha256"
                exit 1
              fi
            done
            appcast="appcast-${target}.xml"
            if [ "$REQUIRE_APPCAST" = "true" ] && { [ ! -f "$appcast" ] || [ ! -f "${appcast}.sha256" ] || ! grep -q 'sparkle:edSignature=' "$appcast"; }; then
              echo "::error::nsgo build made no signed $appcast with its .sha256"
              exit 1
            fi
          done
          if [ -n "$SCRIPTS" ] && { [ ! -f install.sh ] || [ ! -f install.ps1 ]; }; then
            echo "::error::nsgo build made no install.sh or install.ps1"
            exit 1
          fi
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          for file in *; do
            [ -f "$file" ] || continue
            case "$file" in
              install.sh | install.ps1) [ -n "$SCRIPTS" ] || continue ;;
            esac
            cp -- "$file" "$out/"
          done
          ls -lh "$out"
      - name: Upload editor packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editor-${{ matrix.name }}
          path: ${{ runner.temp }}/out/
          retention-days: 7
          if-no-files-found: error
      - name: Clean up signing keychain and notary key
        if: always() && steps.signing.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          NOTARY_KEY: ${{ steps.signing.outputs.notary-key }}
        run: |
          rm -f "$NOTARY_KEY"
          security delete-keychain "$KEYCHAIN"

  cli:
    name: Build nsgo-game CLI
    needs: meta
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Build and archive nsgo-game for all desktop platforms
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/cli"
          mkdir -p "$out"
          for pair in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            goos="${pair%/*}"
            goarch="${pair#*/}"
            os_label="$goos"
            [ "$goos" = "darwin" ] && os_label="macos"
            arch_label="$goarch"
            [ "$goarch" = "amd64" ] && arch_label="x64"
            bin="nsgo-game"
            [ "$goos" = "windows" ] && bin="nsgo-game.exe"
            stage="$RUNNER_TEMP/stage-${os_label}-${arch_label}"
            mkdir -p "$stage"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -o "$stage/$bin" ./cmd/nsgo-game
            base="nsgo-game-${VERSION}-${os_label}-${arch_label}"
            if [ "$goos" = "windows" ]; then
              (cd "$stage" && zip -q "$out/${base}.zip" "$bin")
              (cd "$out" && sha256sum "${base}.zip" > "${base}.zip.sha256")
            else
              tar -C "$stage" -czf "$out/${base}.tar.gz" "$bin"
              (cd "$out" && sha256sum "${base}.tar.gz" > "${base}.tar.gz.sha256")
            fi
          done
          ls -lh "$out"
      - name: Upload CLI archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-binaries
          path: ${{ runner.temp }}/cli/
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish release
    needs:
      - meta
      - test
      - check
      - apple
      - editor
      - cli
    if: >-
      always() &&
      needs.meta.result == 'success' &&
      needs.editor.result == 'success' &&
      needs.cli.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.check.result == 'success' || needs.check.result == 'skipped') &&
      (needs.apple.result == 'success' || needs.apple.result == 'skipped') &&
      (needs.meta.outputs.mode == 'release' || needs.meta.outputs.mode == 'upload')
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*"
          path: ${{ runner.temp }}/downloads
      - name: Assemble and verify asset checksums
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/assets"
          mkdir -p "$assets"
          for dir in "$RUNNER_TEMP"/downloads/editor-* "$RUNNER_TEMP"/downloads/cli-binaries; do
            [ -d "$dir" ] || continue
            cp -- "$dir"/* "$assets/"
          done
          cd "$assets"
          for sum in *.sha256; do
            expected=$(cut -d' ' -f1 "$sum")
            actual=$(sha256sum "${sum%.sha256}" | cut -d' ' -f1)
            if [ "$expected" != "$actual" ]; then
              echo "::error::${sum%.sha256} does not match its .sha256"
              exit 1
            fi
          done
          ls -lh "$assets"
      - name: Publish GitHub Release
        env:
          MODE: ${{ needs.meta.outputs.mode }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "upload" ]; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$RUNNER_TEMP"/assets/*
            exit 0
          fi
          title="NSGo Game ${VERSION}"
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$title" --notes-file "$RUNNER_TEMP/release-notes.md" "${prerelease[@]}" "$RUNNER_TEMP"/assets/*
