name: Agent Eval

# Runs the agent evaluation suite on a daily schedule (and on demand or when the suite changes) to catch regressions in docs, YAML formats, project checks, builds, and MCP tools, reporting a score per task.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: "Optional comma-separated task IDs to run (leave empty for all tasks)"
        required: false
        default: ""
        type: string
      min_score:
        description: "Optional minimum passing score override (0..100; leave empty for task defaults)"
        required: false
        default: ""
        type: string
  push:
    branches:
      - main
    paths:
      - "tools/agenteval/**"
      - ".github/workflows/agent-eval.yml"
  pull_request:
    paths:
      - "tools/agenteval/**"
      - ".github/workflows/agent-eval.yml"

concurrency:
  group: agent-eval-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  eval:
    name: Agent evaluation suite
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: packages/game/go.mod
          cache: true
          cache-dependency-path: |
            packages/game/go.sum
            tools/agenteval/go.sum
      - name: Test the agent evaluation suite
        working-directory: tools/agenteval
        run: go tool nsgo test ./...
      - name: Run agent evaluation suite and report scores
        env:
          EVAL_TASK: ${{ inputs.task }}
          EVAL_MIN_SCORE: ${{ inputs.min_score }}
        run: |
          set -euo pipefail
          args=(-mode=reference -out agent-eval-report.json)
          if [ -n "$EVAL_TASK" ]; then
            args+=("-task=$EVAL_TASK")
          fi
          if [ -n "$EVAL_MIN_SCORE" ]; then
            args+=("-min-score=$EVAL_MIN_SCORE")
          fi
          go run ./tools/agenteval "${args[@]}"
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-eval-report
          path: agent-eval-report.json
          if-no-files-found: warn
