name: Examples

# Tests and cross-checks every example module under examples/ (one matrix entry per examples/<name>/go.mod); tests Cave Run and every chapter of the Star Catcher tutorial on macOS and checks their iOS targets; checks every other example's iOS targets on macOS; builds the web bundles of Cave Run and the tutorial; checks the scenes, maps and atlases of every sample game with game check.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: examples-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  example-list:
    name: List the examples
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: examples
      - name: List the example modules
        id: list
        run: |
          for mod in examples/*/go.mod; do
            dir="${mod%/go.mod}"
            jq -cn --arg example "${dir#examples/}" '{$example}'
          done | jq -cs '{include: .}' > "$RUNNER_TEMP/matrix.json"
          cat "$RUNNER_TEMP/matrix.json"
          echo "matrix=$(cat "$RUNNER_TEMP/matrix.json")" >> "$GITHUB_OUTPUT"

  # One entry per example module from example-list.
  examples:
    name: Test and check ${{ matrix.example }}
    needs: example-list
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.example-list.outputs.matrix) }}
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: examples/${{ matrix.example }}/go.mod
          cache: true
          cache-dependency-path: |
            examples/${{ matrix.example }}/go.sum
            go.sum
      - name: Test
        working-directory: examples/${{ matrix.example }}
        run: go tool nsgo test ./...
      - name: Check targets
        working-directory: examples/${{ matrix.example }}
        run: go tool nsgo check -target macos,windows,linux,android,web

  apple:
    name: Test and check ${{ matrix.example }} (macOS, iOS)
    strategy:
      fail-fast: false
      matrix:
        example:
          - caverun
          - tutorial
    runs-on: depot-macos-15
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: examples/${{ matrix.example }}/go.mod
          cache: true
          cache-dependency-path: |
            examples/${{ matrix.example }}/go.sum
            go.sum
      - name: Test on macOS
        working-directory: examples/${{ matrix.example }}
        run: go tool nsgo test ./...
      - name: Check iOS targets
        working-directory: examples/${{ matrix.example }}
        run: go tool nsgo check -target ios,ios_simulator

  examples-ios:
    name: Check the other examples (iOS)
    runs-on: depot-macos-15
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            examples/*/go.sum
            go.sum
      - name: Check iOS targets
        run: |
          for mod in examples/*/go.mod; do
            dir="${mod%/go.mod}"
            case "${dir#examples/}" in
              caverun|tutorial) continue ;;
            esac
            echo "::group::${dir}"
            (cd "$dir" && go tool nsgo check -target ios,ios_simulator)
            echo "::endgroup::"
          done

  caverun-release:
    name: Check the examples and build web (Cave Run)
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: examples/caverun/go.mod
          cache: true
          cache-dependency-path: |
            examples/caverun/go.sum
            go.sum
      - name: Check the examples' scenes, maps and atlases
        run: go run ./cmd/game check examples
      # Built through game release, so that its go -C <dir> tool nsgo build runs against a real game module.
      - name: Build Cave Run web bundle with game release
        run: |
          go run ./cmd/game release -target web -output examples/caverun/dist examples/caverun
          test -f examples/caverun/dist/releases/cave-run-0.1.0-web.zip
      - name: Upload Cave Run web artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: caverun-web
          path: examples/caverun/dist
          if-no-files-found: error

  tutorial-web:
    name: Build web (tutorial)
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: examples/tutorial/go.mod
          cache: true
          cache-dependency-path: |
            examples/tutorial/go.sum
            go.sum
      - name: Build every chapter for the web
        working-directory: examples/tutorial
        run: |
          for chapter in ch*/; do
            GOFLAGS=-tags=release go tool nsgo build -target web -output "$GITHUB_WORKSPACE/dist/tutorial/${chapter%/}" "./${chapter%/}"
          done
      - name: Upload the finished game's web artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: starcatcher-web
          path: dist/tutorial/ch09-ship
          if-no-files-found: error

  release-build-tag:
    name: Verify release build tag strips debug code
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: examples/fieldmedic/go.mod
          cache: true
          cache-dependency-path: |
            examples/fieldmedic/go.sum
            go.sum
      # Builds an example that imports pkg/tooling/gamedebug for the host desktop target via game release, verifying both GOFLAGS=-tags=release propagation and pkg/tooling/gamedebug's release stub.
      - name: Build Field Medic for the host desktop target with game release
        run: |
          set -euo pipefail
          arch=$(go env GOARCH)
          case "$arch" in
            amd64) target="linux_x64" ;;
            arm64) target="linux_arm64" ;;
            *) echo "unsupported host arch: $arch" >&2; exit 1 ;;
          esac
          out="$RUNNER_TEMP/fieldmedic-release"
          go run ./cmd/game release -target "$target" -output "$out" examples/fieldmedic
          bin="$out/Field Medic-0.1.0-$target/Field Medic"
          test -f "$bin"
          go version -m "$bin" | grep -E '^\s*build\s+-tags=(.*,)?release(,|$)'
      - name: Verify pkg/tooling/gamedebug and tooling release stubs under -tags release
        run: |
          set -euo pipefail
          for pkg in ./pkg/tooling/gamedebug ./pkg/tooling/hotreload ./pkg/tooling/devstate; do
            GOFLAGS=-tags=release go tool nsgo test "$pkg"
          done
          for pkg in ./pkg/physics ./pkg/physics3d; do
            GOFLAGS=-tags=release go tool nsgo test "$pkg" -- -run Release
          done
