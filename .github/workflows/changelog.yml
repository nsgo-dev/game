name: Changelog

# Ensures pull requests that touch user-visible paths add an entry under "## Unreleased" in CHANGELOG.md, unless labeled skip-changelog.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

concurrency:
  group: changelog-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changelog:
    name: Check CHANGELOG.md
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Skip when labeled skip-changelog
        if: contains(github.event.pull_request.labels.*.name, 'skip-changelog')
        run: |
          echo "Skipping changelog check: pull request carries the skip-changelog label."
      - name: Check out
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify changelog entry
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # On pull_request events actions/checkout checks out the synthetic merge commit,
          # whose first parent is the target branch tip. Fall back to BASE_SHA otherwise.
          if git rev-parse --verify -q HEAD^2 >/dev/null; then
            base=$(git rev-parse HEAD^1)
          else
            base="$BASE_SHA"
          fi

          user_visible=()
          while IFS= read -r file; do
            case "$file" in
              packages/*|examples/*|template/*)
                user_visible+=("$file")
                ;;
            esac
          done < <(git diff --name-only "$base" HEAD)

          if [ "${#user_visible[@]}" -eq 0 ]; then
            echo "No user-visible paths changed (packages/, examples/, template/); changelog entry not required."
            exit 0
          fi

          if [ ! -f CHANGELOG.md ]; then
            echo "Error: CHANGELOG.md is missing." >&2
            exit 1
          fi

          if git diff -U999999 "$base" HEAD -- CHANGELOG.md | awk '
            /^@@ / { in_hunk = 1; next }
            !in_hunk { next }
            /^[ +]## / {
              heading = substr($0, 5)
              sub(/^[[:space:]]+/, "", heading)
              sub(/[[:space:]]+$/, "", heading)
              in_unreleased = (heading == "Unreleased" || heading == "[Unreleased]")
              next
            }
            in_unreleased && /^\+/ {
              line = substr($0, 2)
              if (line ~ /^[[:space:]]*$/) next
              if (line ~ /^#{1,6}[[:space:]]/) next
              found = 1
            }
            END { exit (found ? 0 : 1) }
          '; then
            echo "Found changelog entry under ## Unreleased."
            exit 0
          fi

          echo "Error: this pull request modifies user-visible paths without adding an entry under '## Unreleased' in CHANGELOG.md." >&2
          echo "" >&2
          echo "Changed user-visible files:" >&2
          printf '  - %s\n' "${user_visible[@]}" >&2
          echo "" >&2
          echo "Add a short bullet under '## Unreleased' in CHANGELOG.md, or apply the 'skip-changelog' label if this change is internal." >&2
          exit 1
