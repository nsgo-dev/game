name: Check

# Checks Go formatting, and builds and vets every target with the nsgo tool; test.yml runs the tests.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    name: Classify change scope
    runs-on: depot-ubuntu-24.04
    outputs:
      full: ${{ steps.scope.outputs.full }}
      docs: ${{ steps.scope.outputs.docs }}
      mobile: ${{ steps.scope.outputs.mobile }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Classify changed files
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: go run ./internal/ciscope

  # iOS builds need cgo against Xcode's SDKs, which Linux has none of, so Linux vets every other target and a Mac vets iOS, side by side.
  check:
    name: Build and vet
    needs: scope
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Check Go formatting
        if: needs.scope.outputs.full == 'true'
        run: |
          unformatted=$(git ls-files -z -- '*.go' | xargs -0 -r gofmt -l)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Run every job on Depot's runners
        if: needs.scope.outputs.full == 'true'
        run: |
          # Every job runs on Depot (AGENTS.md); a GitHub-hosted label slipping in fails here.
          bad=$(grep -nE '^\s*(runs-on:|-)\s*(ubuntu|macos|windows)-' .github/workflows/*.yml || true)
          if [ -n "$bad" ]; then
            printf '%s\n' "$bad"
            exit 1
          fi
      - name: Check the published JSON Schemas match the Go types
        if: needs.scope.outputs.full == 'true'
        run: go run ./tools/gameschema -check
      - name: Check the generated netplay wire codecs match their YAML schemas
        if: needs.scope.outputs.full == 'true'
        run: |
          go run ./cmd/game wire -in pkg/online/netplay/wire -out pkg/online/netplay/wire -self -check
          go run ./cmd/game wire -lang ts -in pkg/online/netplay/wire -out pkg/online/netplay/wire/ts -check
      - name: Check the service OpenAPI descriptions match the HTTP handlers
        if: needs.scope.outputs.full == 'true'
        run: |
          go tool nsgo test ./pkg/online/cloudsave -- -run TestOpenAPI
          go tool nsgo test ./pkg/online/leaderboard/selfhost -- -run TestOpenAPI
          go tool nsgo test ./internal/repocheck -- -run TestOpenAPI
      - name: Build and vet every target but iOS
        if: needs.scope.outputs.full == 'true'
        run: go tool nsgo check -target macos,windows,linux,android,web

  apple:
    name: Build and vet (iOS)
    needs: scope
    runs-on: depot-macos-15
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Build and vet iOS
        if: needs.scope.outputs.full == 'true'
        run: go tool nsgo check -target ios,ios_simulator

  required:
    name: Required CI
    if: always()
    needs: [scope, check, apple]
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Require every lane to pass or be skipped
        run: |
          for result in "${{ needs.scope.result }}" "${{ needs.check.result }}" "${{ needs.apple.result }}"; do
            case "$result" in success|skipped) ;; *) echo "lane result: $result"; exit 1 ;; esac
          done
