name: Quality

# Runs rendering golden tests, performance baseline checks, input recordings, WebAssembly and mobile (Android AAB / iOS IPA) size budget enforcement, and fuzz smoke tests.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  golden:
    name: Golden rendering tests
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Run golden tests
        run: go tool nsgo test ./pkg/gametest

  benchmarks:
    name: Performance baselines
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Run benchmarks and check baselines
        run: go tool game bench -baseline benchmarks/baseline.yaml ./pkg/sprite ./pkg/tilemap ./pkg/bullets ./pkg/rts ./pkg/ai/navbake3d
      - name: Check the self-hosted leaderboard's 50 ms query budget on a million entries
        run: go test -run='^$' -bench='Top|Around|Friends' -benchtime=50x ./pkg/online/leaderboard/selfhost

  replays:
    name: Input recordings
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Play the recordings headless
        run: go tool game replay ./pkg/replay

  web-size-budget:
    name: WebAssembly size budget
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Check wasm size against budget
        run: |
          set -o pipefail
          go run ./cmd/sizecheck -kind wasm -budget benchmarks/web-budget.json -markdown | tee -a "$GITHUB_STEP_SUMMARY"

  android-size-budget:
    name: Android AAB size budget
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Build Android AAB and check size budget
        run: |
          set -euo pipefail
          trap 'rm -rf ./internal/sizeprobe/.sizecheck-android' EXIT
          go tool nsgo build -target android -channel store -output .sizecheck-android ./internal/sizeprobe
          aab=$(find ./internal/sizeprobe/.sizecheck-android/releases -maxdepth 1 -name '*.aab' | head -n 1)
          if [ -z "$aab" ]; then
            echo "no Android .aab produced" >&2
            exit 1
          fi
          go run ./cmd/sizecheck -kind aab -budget benchmarks/android-aab-budget.json -markdown "$aab" | tee -a "$GITHUB_STEP_SUMMARY"

  ios-size-budget:
    name: iOS IPA size budget
    runs-on: depot-macos-15
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Build iOS IPA and check size budget
        run: |
          set -euo pipefail
          trap 'rm -rf ./internal/sizeprobe/.sizecheck-ios' EXIT
          go tool nsgo build -target ios -output .sizecheck-ios ./internal/sizeprobe
          ipa=$(find ./internal/sizeprobe/.sizecheck-ios/releases -maxdepth 1 -name '*.ipa' | head -n 1)
          if [ -z "$ipa" ]; then
            echo "no iOS .ipa produced" >&2
            exit 1
          fi
          go run ./cmd/sizecheck -kind ipa -budget benchmarks/ios-ipa-budget.json -markdown "$ipa" | tee -a "$GITHUB_STEP_SUMMARY"

  fuzz:
    name: Fuzz file loaders
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Fuzz LoadAtlas
        run: go test -run=^$ -fuzz=^FuzzLoadAtlas$ -fuzztime=10s ./pkg/sprite
      - name: Fuzz LoadTiled
        run: go test -run=^$ -fuzz=^FuzzLoadTiled$ -fuzztime=10s ./pkg/tilemap
      - name: Fuzz LoadTiled TMX
        run: go test -run=^$ -fuzz=^FuzzLoadTiledTMX$ -fuzztime=10s ./pkg/tilemap
      - name: Fuzz LoadTiled compressed data
        run: go test -run=^$ -fuzz=^FuzzLoadTiledCompressed$ -fuzztime=10s ./pkg/tilemap
      - name: Fuzz LoadLDtk
        run: go test -run=^$ -fuzz=^FuzzLoadLDtk$ -fuzztime=10s ./pkg/tilemap
      - name: Fuzz replay Decode
        run: go test -run=^$ -fuzz=^FuzzDecode$ -fuzztime=10s ./pkg/replay
      - name: Fuzz ParseManifest
        run: go test -run=^$ -fuzz=^FuzzParseManifest$ -fuzztime=10s ./pkg/modding
      - name: Fuzz LoadSDFFont
        run: go test -run=^$ -fuzz=^FuzzLoadSDFFont$ -fuzztime=10s ./pkg/text
      - name: Fuzz fog snapshots
        run: go test -run=^$ -fuzz=^FuzzUnmarshalJSON$ -fuzztime=10s ./pkg/fog
      - name: Fuzz framedata Parse
        run: go test -run=^$ -fuzz=^FuzzParse$ -fuzztime=10s ./pkg/framedata
      - name: Fuzz bullet pattern Parse
        run: go test -run=^$ -fuzz=^FuzzParse$ -fuzztime=10s ./pkg/bullets
      - name: Fuzz ParseBoardDoc
        run: go test -run=^$ -fuzz=^FuzzParseBoardDoc$ -fuzztime=10s ./pkg/cards
      - name: Fuzz ParseRules
        run: go test -run=^$ -fuzz=^FuzzParseRules$ -fuzztime=10s ./pkg/procgen
      - name: Fuzz bench baseline Decode
        run: go test -run=^$ -fuzz=^FuzzDecode$ -fuzztime=10s ./pkg/tooling/bench
      - name: Fuzz game check on scenes
        run: go test -run=^$ -fuzz=^FuzzCheckScene$ -fuzztime=10s ./pkg/tooling/assetcheck
      - name: Fuzz game check on Tiled maps
        run: go test -run=^$ -fuzz=^FuzzCheckTiledMap$ -fuzztime=10s ./pkg/tooling/assetcheck
      - name: Fuzz DecodeHDR
        run: go test -run=^$ -fuzz=^FuzzDecodeHDR$ -fuzztime=10s ./pkg/render3d
