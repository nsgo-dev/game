name: Quality

# Runs rendering golden tests, performance baseline checks, WebAssembly and
# mobile (Android AAB / iOS IPA) size budget enforcement, and fuzz smoke tests.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  golden:
    name: Golden rendering tests
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: packages/game/go.mod
          cache: true
          cache-dependency-path: packages/game/go.sum
      - name: Run golden tests
        working-directory: packages/game
        run: go tool nsgo test ./gametest

  benchmarks:
    name: Performance baselines
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: packages/game/go.mod
          cache: true
          cache-dependency-path: packages/game/go.sum
      - name: Run benchmarks and check baselines
        working-directory: packages/game
        run: |
          set -o pipefail
          go test -run=^$ -bench=. -benchmem -benchtime=200ms -count=3 ./sprite ./tilemap | tee /tmp/game-bench.txt
          go run ./cmd/benchcheck -baseline ../../benchmarks/baseline.json -input /tmp/game-bench.txt
      - name: Check the self-hosted leaderboard's 50 ms query budget on a million entries
        working-directory: packages/game
        run: go test -run='^$' -bench='Top|Around|Friends' -benchtime=50x ./leaderboard/selfhost

  web-size-budget:
    name: WebAssembly size budget
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: packages/game/go.mod
          cache: true
          cache-dependency-path: packages/game/go.sum
      - name: Check wasm size against budget
        working-directory: packages/game
        run: |
          set -o pipefail
          go run ./cmd/sizecheck -kind wasm -budget ../../benchmarks/web-budget.json -markdown | tee -a "$GITHUB_STEP_SUMMARY"

  android-size-budget:
    name: Android AAB size budget
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: packages/game/go.mod
          cache: true
          cache-dependency-path: packages/game/go.sum
      - name: Build Android AAB and check size budget
        working-directory: packages/game
        run: |
          set -euo pipefail
          trap 'rm -rf ./cmd/wasmprobe/.sizecheck-android' EXIT
          go tool nsgo build -target android -channel store -output .sizecheck-android ./cmd/wasmprobe
          aab=$(find ./cmd/wasmprobe/.sizecheck-android/releases -maxdepth 1 -name '*.aab' | head -n 1)
          if [ -z "$aab" ]; then
            echo "no Android .aab produced" >&2
            exit 1
          fi
          go run ./cmd/sizecheck -kind aab -budget ../../benchmarks/android-aab-budget.json -markdown "$aab" | tee -a "$GITHUB_STEP_SUMMARY"

  ios-size-budget:
    name: iOS IPA size budget
    runs-on: depot-macos-15
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: packages/game/go.mod
          cache: true
          cache-dependency-path: packages/game/go.sum
      - name: Build iOS IPA and check size budget
        working-directory: packages/game
        run: |
          set -euo pipefail
          trap 'rm -rf ./cmd/wasmprobe/.sizecheck-ios' EXIT
          go tool nsgo build -target ios -output .sizecheck-ios ./cmd/wasmprobe
          ipa=$(find ./cmd/wasmprobe/.sizecheck-ios/releases -maxdepth 1 -name '*.ipa' | head -n 1)
          if [ -z "$ipa" ]; then
            echo "no iOS .ipa produced" >&2
            exit 1
          fi
          go run ./cmd/sizecheck -kind ipa -budget ../../benchmarks/ios-ipa-budget.json -markdown "$ipa" | tee -a "$GITHUB_STEP_SUMMARY"

  fuzz:
    name: Fuzz file loaders
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: packages/game/go.mod
          cache: true
          cache-dependency-path: packages/game/go.sum
      - name: Fuzz LoadAtlas
        working-directory: packages/game
        run: go test -run=^$ -fuzz=^FuzzLoadAtlas$ -fuzztime=10s ./sprite
      - name: Fuzz LoadTiled
        working-directory: packages/game
        run: go test -run=^$ -fuzz=^FuzzLoadTiled$ -fuzztime=10s ./tilemap
      - name: Fuzz replay Decode
        working-directory: packages/game
        run: go test -run=^$ -fuzz=^FuzzDecode$ -fuzztime=10s ./replay
      - name: Fuzz ParseManifest
        working-directory: packages/game
        run: go test -run=^$ -fuzz=^FuzzParseManifest$ -fuzztime=10s ./modding
      - name: Fuzz LoadSDFFont
        working-directory: packages/game
        run: go test -run=^$ -fuzz=^FuzzLoadSDFFont$ -fuzztime=10s ./text
      - name: Fuzz fog snapshots
        working-directory: packages/game
        run: go test -run=^$ -fuzz=^FuzzUnmarshalJSON$ -fuzztime=10s ./fog
