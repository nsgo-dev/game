name: Test

# Tests every package headless with the nsgo tool on Linux and macOS, and the Postgres account store against a Postgres service.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - depot-ubuntu-24.04-4
          - depot-macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: packages/game/go.mod
          cache: true
          cache-dependency-path: packages/game/go.sum
      # The game command's completion tests drive each shell it writes a script for, and fish is the one the runners lack.
      - name: Install fish
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fish
      - name: Test
        working-directory: packages/game
        run: go tool nsgo test ./...

  # The Postgres stores' tests skip without a database, so this job gives them one.
  postgres:
    name: Test (Postgres store)
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
        env:
          POSTGRES_PASSWORD: accounts-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: packages/game/go.mod
          cache: true
          cache-dependency-path: packages/game/go.sum
      - name: Test the Postgres store
        working-directory: packages/game
        env:
          ACCOUNTS_POSTGRES_DSN: postgres://postgres:accounts-ci@127.0.0.1:5432/postgres?sslmode=disable
        run: go tool nsgo test ./accounts/pgstore/...
      - name: Test the cloud save Postgres store
        working-directory: packages/game
        env:
          CLOUDSAVE_POSTGRES_DSN: postgres://postgres:accounts-ci@127.0.0.1:5432/postgres?sslmode=disable
        run: go tool nsgo test ./cloudsave/sqlstore/...

  # Lists one matrix entry per template game new offers, from the template directories on disk: starter in template/template and every other template in template/<name>/template, which TestTemplatesMatchTemplateModules keeps the same as the registry in packages/game/internal/gamecli/templates.go. Adding a template therefore needs no edit here.
  template-list:
    name: List the templates
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: template
      - name: List the template directories
        id: list
        run: |
          {
            jq -cn '{template: "starter", dir: "template/template"}'
            for dir in template/*/template; do
              [ -d "$dir" ] || continue
              name="${dir#template/}"
              jq -cn --arg template "${name%/template}" --arg dir "$dir" '{$template, $dir}'
            done
          } | jq -cs '{include: .}' > "$RUNNER_TEMP/matrix.json"
          cat "$RUNNER_TEMP/matrix.json"
          echo "matrix=$(cat "$RUNNER_TEMP/matrix.json")" >> "$GITHUB_OUTPUT"

  # One entry per template from template-list; dir is the template directory of the template's module.
  templates:
    name: Test the ${{ matrix.template }} template against its pinned modules
    needs: template-list
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.template-list.outputs.matrix) }}
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: packages/game/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.dir }}/go.sum
      # A game made with nsgo init -template builds against the packages/game version go.mod.tmpl pins, not this checkout: test a copy outside the workspace so a stale pin fails here.
      - name: Test a game made from the template
        env:
          GOWORK: "off"
          TEMPLATE: ${{ matrix.template }}
          TEMPLATE_DIR: ${{ matrix.dir }}
        run: |
          dir="$RUNNER_TEMP/${TEMPLATE}game"
          cp -R "$TEMPLATE_DIR" "$dir"
          sed "s|{{.Module}}|example.com/${TEMPLATE}game|" "$dir/go.mod.tmpl" > "$dir/go.mod"
          rm "$dir/go.mod.tmpl"
          cd "$dir"
          go tool nsgo test ./...
