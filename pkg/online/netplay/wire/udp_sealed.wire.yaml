# yaml-language-server: $schema=https://game.nsgo.dev/schemas/wire.v1.json
version: 1
package: wire
order: be
imports:
  - transport.wire.yaml
enums:
  - name: UDPDatagramType
    doc: UDPDatagramType identifies the direction and purpose of a sealed UDP session datagram.
    type: u8
    values:
      - name: data
        value: 177
        doc: Client-to-server application datagram (0xB1).
      - name: server_data
        value: 178
        doc: Server-to-client application datagram (0xB2).
      - name: ping
        value: 179
        doc: Client-to-server keepalive ping (0xB3).
      - name: pong
        value: 180
        doc: Server-to-client keepalive reply (0xB4).
      - name: bye
        value: 181
        doc: Client-to-server session goodbye (0xB5).
      - name: peer_data
        value: 182
        doc: UDPTransport pre-shared key peer datagram (0xB6).
      - name: kick
        value: 183
        doc: Server-to-client session removal whose payload is the reason (0xB7).
messages:
  - name: UDPSealedDatagram
    doc: UDPSealedDatagram is a ChaCha20-Poly1305 AEAD UDP datagram with a 10-byte cleartext header (type, peer, seq, channel) authenticated as associated data followed by ciphertext and a 16-byte Poly1305 tag.
    fields:
      - name: type
        type: UDPDatagramType
      - name: peer
        type: u32
      - name: seq
        type: u32
      - name: channel
        type: Channel
      - name: sealed
        doc: ChaCha20-Poly1305 ciphertext followed by the 16-byte Poly1305 authentication tag.
        type: bytes
        length: rest
