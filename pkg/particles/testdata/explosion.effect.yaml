version: 1
emitters:
  - config:
      space: world
      shape:
        kind: circle
        radius: 6
      rate: 45
      lifetimeMin: 300ms
      lifetimeMax: 700ms
      colorCurve:
        - t: 0
          color: "#ffd166ff"
    duration: 200ms
  - file: fx/sparks.particles.yaml
    offsetX: 4
    offsetY: -2
    delay: 50ms
    minQuality: medium
params:
  count:
    type: int
    int: 12
  scale:
    type: vec2
    vec2: [1, 0.5]
  speed:
    type: float
    float: 1.5
  tint:
    type: color
    color: "#ff8800ff"
