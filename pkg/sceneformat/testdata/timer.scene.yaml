# yaml-language-server: $schema=https://game.nsgo.dev/schemas/scene.v1.json
version: 1
name: Timer
layers:
  - name: main
    objects:
      - id: spawn_timer
        components:
          timer:
            autostart: true
            oneShot: false
            seconds: 2.5
      - id: spawner
        components:
          spawner: {}
connections:
  - from: spawn_timer
    event: timeout
    to: spawner
    handler: spawn
